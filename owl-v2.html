<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Psyche — Owl</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#06090f; --cream:#faf8f3; --indigo:#1d3891;
    --veil:rgba(4,7,14,0.62); --line:rgba(250,248,243,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--night); color:var(--cream);
    font-family:'Cormorant Garamond',serif;
    overflow:hidden; position:fixed; inset:0;
  }
  .scene{position:absolute; inset:0; overflow:hidden; background:var(--night);}

  /* Owl video — owl high in frame, chat in the lower shadow (Option B) */
  #owl{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center 22%;
    background:var(--night);
  }
  .scrim{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(rgba(6,9,15,0.15), transparent 22%, transparent 40%, rgba(6,9,15,0.72) 70%, rgba(6,9,15,0.95));
  }
  .glowring{
    position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 120px rgba(250,240,210,0);
    transition:box-shadow .8s ease;
  }
  .scene.owlspeaking .glowring{ box-shadow:inset 0 0 120px rgba(250,240,210,0.24); }

  /* Top bar */
  
  
  

  /* Chat window — sits above the composer */
  .chatwin{
    position:absolute; left:0; right:0; bottom:112px;
    height:44vh; z-index:5;
    display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.15) 8%, #000 22%, #000 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.15) 8%, #000 22%, #000 100%);
  }
  .chat-inner{
    width:100%; max-width:620px; margin:0 auto; padding:0 20px;
    display:flex; flex-direction:column; gap:12px;
  }

  /* ── bubbles: owl = indigo (left), user = veil (right) ── */
  .msg{ animation:rise .5s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .msg.avatarmsg{
    align-self:flex-start; max-width:86%;
    background:var(--veil);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1px solid rgba(250,248,243,0.09);
    border-radius:16px; border-bottom-left-radius:5px;
    padding:11px 16px; font-size:17px; line-height:1.5;
  }
  .msg.user{
    align-self:flex-end; max-width:78%;
    background:rgba(29,56,145,0.45);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    border:1px solid rgba(250,248,243,0.1);
    border-radius:16px; border-bottom-right-radius:5px;
    padding:10px 15px; font-size:17px; line-height:1.45;
  }

  /* Composer — pinned at the bottom (user types here) */
  .composer{
    position:absolute; left:0; right:0; bottom:50px; z-index:6;
    width:100%; max-width:620px; margin:0 auto; padding:0 20px;
  }
  .composer-inner{
    display:flex; align-items:center; min-height:46px;
    background:var(--veil);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border:1px solid rgba(250,248,243,0.16);
    border-radius:22px; padding:9px 18px;
  }
  .field{ padding-left:18px;
    flex:1; font-family:'Cormorant Garamond',serif; font-size:17px;
    color:var(--cream); line-height:1.4; min-height:1.4em; white-space:pre-wrap;
  }
  .field.empty::after{ content:'Speak freely…'; font-style:italic; color:rgba(250,248,243,0.4); }
  .field .car{ opacity:.6; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0;} }
  .send{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; margin-left:8px;
    background:var(--cream); color:var(--night);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }

  /* Honesty caption */
  .caption{
    position:absolute; left:0; right:0; bottom:18px; z-index:5;
    text-align:center; font-style:italic; font-size:.85rem;
    color:rgba(250,248,243,0.45);
  }

  /* Tap gate (needed for video sound autoplay) */
  .gate{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; background:rgba(6,9,15,0.55); backdrop-filter:blur(2px); cursor:pointer;
  }
  .gate .play{
    width:78px; height:78px; border-radius:50%;
    border:1px solid rgba(250,248,243,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color:var(--cream); background:rgba(250,248,243,0.06);
  }
  .gate .hint{font-style:italic; color:rgba(250,248,243,0.75); font-size:1.05rem;}

  .replay{
    position:absolute; top:14px; right:16px; z-index:8;
    background:transparent; border:1px solid rgba(250,248,243,0.4);
    color:var(--cream); border-radius:20px; padding:6px 15px;
    font-family:'Cormorant Garamond',serif; font-size:.95rem; cursor:pointer;
    opacity:0; transition:opacity .5s ease;
  }
  .replay.show{opacity:.8;}
  .mic{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    color:var(--cream);opacity:.55;border:1px solid rgba(250,248,243,.25);transition:.3s;position:relative;}
  .mic.live{opacity:1;color:#fff;background:rgba(29,56,145,.55);border-color:rgba(111,134,214,.8);}
  .mic.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(111,134,214,.65);
    animation:micpulse 1.1s ease-out infinite;}
  @keyframes micpulse{0%{transform:scale(.85);opacity:.9;}100%{transform:scale(1.5);opacity:0;}}
  .xclose{position:absolute;top:14px;right:16px;z-index:30;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(250,248,243,.35);background:rgba(6,9,15,.4);color:var(--cream);font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;
    gap:14px;height:58px;padding:0 20px;background:linear-gradient(rgba(6,9,15,.55),transparent);pointer-events:none}
  .menu-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
  .menu-btn span{display:block;width:18px;height:1px;background:#e8e4dc;opacity:.7;box-shadow:0 1px 4px rgba(0,0,0,.9)}
  .mark{font-family:'Cinzel',serif;font-weight:500;font-size:17px;letter-spacing:.32em;text-indent:.32em;color:#e8e4dc;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  html.ap .gate{display:none!important}
</style>
</head>
<body>
<div class="scene" id="scene">
  <video id="owl" playsinline preload="auto"></video>
  <div class="scrim"></div>
  <div class="glowring"></div>

  <div class="topbar"><button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button><div class="mark">PSYCHE</div></div>

  <button class="xclose" id="xclose" aria-label="Close">&times;</button>

  <div class="chatwin"><div class="chat-inner" id="chat"></div></div>

  <div class="composer">
    <div class="composer-inner">
      <div class="mic" id="micbtn"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></div><div class="field empty" id="field"></div>
      <div class="send">&#8593;</div>
    </div>
  </div>

  <div class="caption">Speak or type — Psyche meets you either way.</div>

  <div class="gate" id="gate">
    <div class="play">&#9654;</div>
    <div class="hint">Meet the owl</div>
  </div>
</div>

const $ = id => document.getElementById(id);
const scene=$('scene'), owl=$('owl'), chat=$('chat'),
      field=$('field'), gate=$('gate'), replay={classList:{add:function(){},remove:function(){}},addEventListener:function(){}};
const typeSounds=[$('t1'),$('t2'),$('t3')];
let tsi=0;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const scrollDown = ()=>{ const w=chat.parentElement; w.scrollTop=w.scrollHeight; };
function nextTypeSound(){ const s=typeSounds[tsi%3]; tsi++; return s; }

function pushBubble(role){
  const d=document.createElement('div');
  d.className = 'msg ' + (role==='owl' ? 'avatarmsg' : 'user');
  chat.appendChild(d);
  scrollDown();
  return d;
}

];
const typeAudios=TYPE_DATA.map(d=>new Audio(d));
typeAudios.forEach(a=>{ a.volume=.55; a.preload='auto'; });
let typeIdx=0;
async function userVoiceTurn(step){
  const text = step.text;
  const mic = document.getElementById('micbtn');
  mic.classList.add('live');
  field.classList.remove('empty');
  field.innerHTML='<span class="car">|</span>';
  const a = new Audio(USER_VOX[step.v]);
  let dur = 1800;
  try{
    await new Promise(r=>{ var done=false; function fin(){ if(!done){done=true;r();} }
      a.addEventListener('loadedmetadata',fin,{once:true});
      a.addEventListener('error',fin,{once:true});
      setTimeout(fin,1200); a.load(); });
    if(isFinite(a.duration) && a.duration>0) dur = Math.max(900, a.duration*1000);
  }catch(e){}
  try{ a.play(); }catch(e){}
  const per = Math.max(20, Math.floor((dur-250)/text.length));
  for(let i=0;i<text.length;i++){
    field.innerHTML = text.slice(0,i+1) + '<span class="car">|</span>';
    await sleep(per);
  }
  await new Promise(r=>{ if(a.ended) r(); else { a.addEventListener('ended',r,{once:true}); setTimeout(r, dur+600); } });
  mic.classList.remove('live');
  field.innerHTML=''; field.classList.add('empty');
  const b=pushBubble('user'); b.textContent=text;
  await sleep(560);
}

async function userTurn(step){
  if(step.mode==='voice'){ return userVoiceTurn(step); }
  const text = step.text;
  field.classList.remove('empty');
  field.innerHTML='<span class="car">|</span>';
  const snd=typeAudios[typeIdx%3]; typeIdx++;
  try{ snd.pause(); snd.currentTime=0; snd.loop=true; await snd.play(); }catch(e){}
  for(let i=0;i<text.length;i++){
    field.innerHTML = text.slice(0,i+1) + '<span class="car">|</span>';
    await sleep(44);
  }
  try{ snd.loop=false; snd.pause(); snd.currentTime=0; }catch(e){}
  await sleep(320);
  // send: clear the box, raise the bubble
  field.innerHTML='';
  field.classList.add('empty');
  const b=pushBubble('user');
  b.textContent=text;
  await sleep(560);
}

/* OWL: single stitched video plays through; type the reply during its segment.
   Each owl line lives at a fixed offset in owl-finished.mp4 (0,8,16,24,32,40s). */
const SEG = 8; // seconds per owl segment
async function owlTurn(seg, text){
  const start = (seg-1)*SEG;
  // make sure the video is at this segment and playing
  scene.classList.add('owlspeaking');
  try{
    if(Math.abs(owl.currentTime - start) > 0.4) owl.currentTime = start;
    await owl.play();
  }catch(e){}
  const b=pushBubble('owl');
  const per = Math.max(22, Math.floor((SEG*1000 - 1200)/text.length));
  for(let i=0;i<text.length;i++){
    b.textContent=text.slice(0,i+1);
    scrollDown();
    await sleep(per);
  }
  // hold until this 8s segment finishes, then pause for the user's turn
  const target = start + SEG;
  while(owl.currentTime < target - 0.15 && !owl.ended){ await sleep(80); }
  owl.pause();
  scene.classList.remove('owlspeaking');
  await sleep(250);
}

async function run(){
  chat.innerHTML='';
  field.innerHTML=''; field.classList.add('empty');
  replay.classList.remove('show');
  await sleep(700);
  for(const step of SCRIPT){
    if(step.role==='user') await userTurn(step);
    else await owlTurn(step.clip, step.text);
  }
  replay.classList.add('show');
  try{ if(window.parent!==window) window.parent.postMessage('psyche:done','*'); }catch(e){}
}

gate.addEventListener('click', ()=>{
  gate.style.display='none';
  // UNLOCK every audio element during this real user gesture
  typeAudios.forEach(a=>{ try{ a.muted=true; const p=a.play(); if(p) p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;}); }catch(e){} });
  owl.src = BASE+'owl-v2.mp4'; owl.load();
  try{ owl.currentTime=0; }catch(e){}
  run();
});
