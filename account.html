<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Account · Psyche</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf9f5;--ink:#2c2a25;--muted:#8a8378;--line:#e7e3d9;--hover:#eae7dd;--indigo:#1d3891;--indigo-deep:#16296b;--field:#ffffff;--danger:#a8443a;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;min-height:100dvh;}
  header{padding:22px 26px;display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:"Cinzel",serif;font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:1.18rem;color:var(--indigo);text-decoration:none;}
  .back{font-size:.88rem;color:var(--muted);text-decoration:none;}
  .back:hover{color:var(--ink);}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 20px 50px;}
  .wrap{width:100%;max-width:560px;}
  h1{font-size:1.5rem;font-weight:500;letter-spacing:-.01em;color:#23201a;margin-bottom:4px;}
  .sub{font-size:.9rem;color:var(--muted);margin-bottom:26px;}
  .card{background:var(--field);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px;}
  .card h2{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #f0ede5;}
  .row:last-child{border-bottom:none;}
  .row .lbl{font-size:.92rem;color:var(--muted);}
  .row .val{font-size:.95rem;color:var(--ink);font-weight:500;text-align:right;}
  .pill{display:inline-block;background:#eef0f8;color:var(--indigo);font-size:.78rem;font-weight:600;padding:4px 12px;border-radius:20px;}
  /* usage bar */
  .usage{margin-top:6px;}
  .bar{height:8px;border-radius:6px;background:#ece8df;overflow:hidden;margin:10px 0 6px;}
  .bar i{display:block;height:100%;width:42%;background:var(--indigo);border-radius:6px;}
  .usage .meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
  .btn{border-radius:11px;padding:10px 16px;font-size:.9rem;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:background .15s;text-decoration:none;display:inline-flex;align-items:center;}
  .btn:hover{background:var(--hover);}
  .btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .btn.primary:hover{background:var(--indigo-deep);}
  .btn.danger{color:var(--danger);border-color:#e6d2cd;background:#fbf4f2;}
  .btn.danger:hover{background:#f6e7e3;}
  .note{font-size:.72rem;color:#b3ab9c;text-align:center;margin-top:18px;}
  footer{padding:20px 26px;text-align:center;font-size:.78rem;color:var(--muted);}
  footer a{color:var(--muted);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <header>
    <a href="index.html" class="wordmark">Psyche</a>
    <a href="index.html" class="back">← Back to Psyche</a>
  </header>

  <main>
    <div class="wrap">
      <h1>Account</h1>
      <div class="sub">Manage your plan, usage, and sign-in.</div>

      <!-- PROFILE -->
      <div class="card">
        <h2>Profile</h2>
        <div class="row"><span class="lbl">Name</span><span class="val" style="display:flex;gap:8px;align-items:center;justify-content:flex-end;"><input id="acctName" type="text" maxlength="60" placeholder="Not set" style="font:inherit;text-align:right;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--field);color:var(--ink);max-width:190px;"><button class="btn" id="saveName" style="padding:6px 12px;">Save</button></span></div>
        <div class="row"><span class="lbl">Email</span><span class="val" id="acctEmail">…</span></div>
        <div class="row"><span class="lbl">Signed in with</span><span class="val" id="acctProvider">Email link</span></div>
      </div>

      <!-- PLAN -->
      <div class="card">
        <h2>Plan</h2>
        <div class="row"><span class="lbl">Current plan</span><span class="val"><span class="pill">Free</span></span></div>
        <div class="usage">
          <div class="bar"><i></i></div>
          <div class="meta"><span>13 of 30 messages used</span><span>Resets 1 Jul</span></div>
        </div>
        <div class="actions" style="margin-top:16px;">
          <a href="pricing.html" class="btn primary">Upgrade plan</a>
        </div>
      </div>

      <!-- SESSION -->
      <div class="card">
        <h2>Session</h2>
        <div class="actions">
          <button class="btn" id="logout">Log out</button>
          <button class="btn danger" id="del">Delete account</button>
        </div>
      </div>

      <div class="note">Account deletion isn’t connected yet — coming soon.</div>
    </div>
  </main>

  <footer>
    <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · Questions? <a href="mailto:support@psyche.ai">support@psyche.ai</a>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL="https://hydzekyzbqhcvajnuegh.supabase.co";
  const SB_KEY="sb_publishable_4OMJbKxYkzEapBMABHuThw_E60ZNWEb";
  const sb=supabase.createClient(SB_URL,SB_KEY);
  const $=id=>document.getElementById(id);

  let acctUid=null;
  // Load the real session; if there's none, send them to sign in.
  sb.auth.getSession().then(async({data})=>{
    const s=data.session;
    if(!s || !s.user){ location.replace("auth.html"); return; }
    acctUid=s.user.id;
    $("acctEmail").textContent=s.user.email||"—";
    const prov=(s.user.app_metadata&&s.user.app_metadata.provider)||"email";
    $("acctProvider").textContent=prov==="email"?"Email link":prov.charAt(0).toUpperCase()+prov.slice(1);
    const {data:p,error}=await sb.from("profiles").select("display_name").eq("id",acctUid).single();
    if(error){ console.error("profile fetch failed:", error); return; }
    if(p&&p.display_name) $("acctName").value=p.display_name;
  });

  $("saveName").onclick=async()=>{
    if(!acctUid) return;
    const name=$("acctName").value.trim().slice(0,60);
    const btn=$("saveName"), label=btn.textContent;
    btn.disabled=true; btn.textContent="Saving…";
    const {data:rows,error}=await sb.from("profiles").update({display_name:name}).eq("id",acctUid).select();
    btn.disabled=false;
    if(error||!rows||!rows.length){
      console.error("display_name save failed (check the RLS UPDATE policy):", error);
      btn.textContent="Try again"; setTimeout(()=>btn.textContent=label,1800); return;
    }
    btn.textContent="Saved ✓"; setTimeout(()=>btn.textContent=label,1800);
  };

  $("logout").onclick=async()=>{
    await sb.auth.signOut();
    location.href="index.html";
  };
  $("del").onclick=()=>{
    if(confirm("Delete your account and all conversations? This can’t be undone.")) alert("Delete account — coming soon.");
  };
</script>
</body>
</html>
