<!DOCTYPE html>
<html lang="en">
<head>
<script src="preview.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meditations · Sussuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="site.css?v=20261124a">
<link rel="stylesheet" href="meditation-cover.css?v=20261116a">
<style>
  :root{
    /* black and white only (design rules, 14 Nov 2026); old names kept */
    --cream:#fff; --night:#000; --panel:#000; --navline:#333;
    --bg:#000;--fg:#fff;--mute:#d6d6d6;--faint:#a8a8a8;--line:#4a4a4a;--spine:#333;--indigo:#fff;--ig:#fff
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#000;color:#fff;font-family:var(--font-jost);font-weight:300;-webkit-font-smoothing:antialiased;
    display:flex;height:100dvh;overflow:hidden;
  }
  a{color:inherit;}

  .fbmodal{ position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .fbmodal.open{ display: flex; }
  .fbcard{ background: #000; border: 1px solid var(--s-border); border-radius: 8px; padding: 24px; max-width: 420px; width: 100%; color: #fff; font-family:var(--font-jost); font-weight:300; }
  .fbcard h3{ font-family:var(--font-jost); font-weight: 400; font-size: 22px; margin-bottom: 8px; }
  .fbcard p{ color: var(--s-text2); font-size: 15px; margin-bottom: 14px; line-height: 1.5; }
  .fbcard textarea{ width: 100%; min-height: 100px; background: transparent; border: 1px solid var(--s-border); border-radius: 8px; padding: 12px; color: #fff; font-family:var(--font-jost); font-weight:300; font-size: 16px; outline: none; resize: none; }
  .fbcard .row{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .fbcard .row button{ height: 44px; padding: 0 20px; border-radius: 8px; font-family:var(--font-jost); font-weight:500; font-size: 12.5px; letter-spacing:.2em; text-transform:uppercase; cursor: pointer; }
  .fbcard .ghost{ background: transparent; border: 1px solid #fff; color: #fff; }
  .fbcard .primary{ background: #fff; border: 1px solid #fff; color: #000; }

  /* ================= MAIN — Meditations (Your path) =================
     The finished guided meditations, three to a row. Tap one and it plays in the bar along the bottom. */
  main{ flex:1; min-width:0; overflow-y:auto; background:#000; padding:56px 72px 0; scrollbar-width:thin; scrollbar-color:#666 #000; display:flex; flex-direction:column; }
  .head{display:flex;flex-direction:column;gap:14px;padding:0 0 36px;border-bottom:1px solid var(--s-rule);text-align:left;flex:0 0 auto;}
  /* category row: between two thin lines */
  .cats{display:flex;gap:10px;padding:18px 0;border-bottom:1px solid var(--s-rule);flex:0 0 auto;overflow-x:auto;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{flex:0 0 auto;height:40px;padding:0 18px;border:1px solid var(--s-border);border-radius:8px;background:transparent;color:#fff;font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;cursor:pointer;}
  .cat.on{background:#fff;border-color:#fff;color:#000;}
  .cat:focus{outline:none;} .cat:focus-visible{outline:2px solid #808080;outline-offset:3px;}

  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:48px 0 80px;flex:0 0 auto;}
  .tile{display:flex;flex-direction:column;padding:0;border:1px solid var(--s-border);border-radius:8px;overflow:hidden;background:#000;color:#fff;text-align:left;cursor:pointer;font-family:var(--font-jost);font-weight:300;transition:border-color .15s;}
  .tile:hover,.tile.on{border-color:#fff;}
  .tile[hidden]{display:none;}
  .tile .cover{border-bottom:1px solid var(--s-rule);}
  .tile .cap{display:flex;align-items:flex-start;gap:16px;padding:18px 20px 20px;flex:1;}
  .tile .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .tile .tag,.player .tag,.player .time{font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-label);}
  .tile .about{font-size:15px;line-height:1.5;color:var(--s-text2);}   /* one full sentence, never cut off */
  /* the label keeps to one line across the whole card; the sentence and the play button sit under it */
  .tile .cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start;align-content:start;}
  .tile .txt{display:contents;}
  .tile .tag{grid-column:1/-1;white-space:nowrap;}
  .round{flex:0 0 auto;width:44px;height:44px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;}
  .round svg{width:14px;height:14px;fill:currentColor;}
  .tile.on .round{background:#fff;color:#000;}

  /* the player: stays along the bottom of the black area while you scroll */
  .player{position:sticky;bottom:0;margin:auto -72px 0;padding:14px 72px 16px;background:#000;border-top:1px solid var(--s-rule);display:flex;align-items:center;gap:20px;flex:0 0 auto;}
  .player[hidden]{display:none;}
  .player .cv{flex:0 0 auto;width:120px;border-radius:8px;border:1px solid var(--s-rule);overflow:hidden;}   /* a quarter larger than before (was 96px); shows the cover of what is playing */
  .player .pp{width:52px;height:52px;cursor:pointer;}
  .player .pp svg{width:16px;height:16px;}
  .player .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .player .now{display:flex;align-items:baseline;gap:14px;min-width:0;}
  .player .ttl{font-weight:400;font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player .tag{white-space:nowrap;}
  .player .scrub{position:relative;height:24px;cursor:pointer;display:flex;align-items:center;}
  .player .scrub::before{content:"";position:absolute;left:0;right:0;height:2px;background:#4a4a4a;}
  .player .scrub i{position:relative;display:block;height:2px;width:0;background:#fff;}
  .player .credit{font-size:13px;color:var(--s-label);}
  .player .credit b{font-weight:400;color:#fff;}
  .head .lede{font-size:var(--s-read);line-height:1.5;color:var(--s-label);} .head .lede b{font-weight:300;color:#fff;}
  .player .time{flex:0 0 auto;white-space:nowrap;}

  /* tablet and phone: the player keeps to two lines */
  @media (max-width:1023px){
    main{padding:36px 20px 0;}
    .head{gap:10px;padding-bottom:24px;}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:30px 0 40px;}   /* tablet: two to a row */
    .cats{padding:14px 0;margin:0 -20px;padding-left:20px;padding-right:20px;}
    .cat{height:44px;}
    .player{margin:auto -20px 0;padding:12px 20px 14px;gap:14px;}
    .player .cv{display:none;}
    .player .credit{display:none;}
    .player .ttl{font-size:16px;}
    .player .tag{display:none;}   /* the tile already shows it; keeps the time clear of the name */
  }
  @media (max-width:640px){ .tiles{grid-template-columns:1fr;} }   /* phone: one to a row */
</style>
</head>
<body class="site-shell">

<script src="site-header.js?v=20261124a"></script>

<main>
  <header class="head"><h1 class="page-title">Meditations</h1><p class="lede">Written by <b>Mark Carpenter</b>. Spoken in his voice, made with AI.</p></header>
  <div class="cats" id="cats" role="group" aria-label="Category"></div>
  <div class="tiles" id="tiles"></div>
  <div class="player" id="player" hidden>
    <span class="cv" id="plCover" aria-hidden="true"></span>
    <button type="button" class="round pp" id="plBtn" aria-label="Play"><svg id="plIcon" aria-hidden="true" viewBox="0 0 20 20"><path d="M4 2l14 8-14 8z"/></svg></button>
    <div class="mid">
      <div class="now"><span class="ttl" id="plTitle"></span><span class="tag" id="plTag"></span></div>
      <div class="scrub" id="plScrub" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="plBar"></i></div>
      <div class="credit">Written by <b>Mark Carpenter</b>. Spoken in his voice, made with AI.<span id="plExtra"></span></div>
    </div>
    <span class="time"><span id="plCur">0:00</span> / <span id="plDur">0:00</span></span>
    <audio id="plAudio" preload="none"></audio>
  </div>
</main>

<div class="fbmodal" id="fbModal">
  <div class="fbcard">
    <h3>Help &amp; feedback</h3>
    <p>What's working, what isn't, what would make this worth it? Anything helps.</p>
    <textarea id="fbText" placeholder="Type your thoughts&hellip;"></textarea>
    <div class="row">
      <button class="ghost" id="fbCancel">Cancel</button>
      <button class="primary" id="fbSend">Send</button>
    </div>
  </div>
</div>

<!-- The finished sessions, and the cover each one gets from its title, live in meditation-sessions.js (shared with the Meditation library). -->
<script src="meditation-sessions.js?v=20261124a"></script>
<script>
(function(){
  var S=window.SUSSURI_SESSIONS;
  var tiles=document.getElementById('tiles'), player=document.getElementById('player');
  var a=document.getElementById('plAudio'), btn=document.getElementById('plBtn'), icon=document.getElementById('plIcon');
  var bar=document.getElementById('plBar'), scrub=document.getElementById('plScrub'), cur=document.getElementById('plCur'), dur=document.getElementById('plDur');
  var PLAY='<path d="M4 2l14 8-14 8z"/>', PAUSE='<path d="M4 2h4v16H4zM12 2h4v16h-4z"/>';
  var now=-1;
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(t){ t=Math.max(0,t|0); return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2); }
  function tag(it){ return [it.label,it.length].filter(Boolean).join(' \u00b7 '); }            // player bar: GUIDED MEDITATION · NN MINS
  var cardTag=window.sussuriCardTag, short=window.sussuriShort, cover=window.sussuriCover;   // shared with the Meditation library
  // category row: All first, then each category in the order it first appears below
  // the row follows the library: a category shows only when a meditation carries that label
  var ORDER=window.SUSSURI_CATEGORIES.filter(function(c){ return S.some(function(it){ return it.category===c; }); }), cats=document.getElementById('cats'), showing='All';
  S.forEach(function(it){ if(it.category && ORDER.indexOf(it.category)<0) ORDER.push(it.category); });
  ['All'].concat(ORDER).forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='cat'+(c==='All'?' on':''); b.textContent=c; b.setAttribute('aria-pressed',String(c==='All'));
    b.onclick=function(){ showing=c;
      [].forEach.call(cats.children,function(x){ var on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',String(on)); });
      [].forEach.call(tiles.children,function(t,i){ t.hidden=!(c==='All'||S[i].category===c); });
    };
    cats.appendChild(b);
  });

  S.forEach(function(it,i){
    var t=document.createElement('button');
    t.type='button'; t.className='tile'; t.setAttribute('aria-label','Play '+it.title);
    t.innerHTML=cover(it)+
      '<span class="cap"><span class="txt"><span class="tag">'+esc(cardTag(it))+'</span><span class="about">'+esc(window.sussuriCardLine(it))+'</span></span>'+
      '<span class="round" aria-hidden="true"><svg viewBox="0 0 20 20">'+PLAY+'</svg></span></span>';
    t.onclick=function(){ pick(i); };
    tiles.appendChild(t);
  });

  function mark(){
    [].forEach.call(tiles.children,function(t,i){
      var on=(i===now && !a.paused);
      t.classList.toggle('on',i===now);
      t.querySelector('.round svg').innerHTML = on?PAUSE:PLAY;
      t.setAttribute('aria-label',(on?'Pause ':'Play ')+S[i].title);
    });
    icon.innerHTML=a.paused?PLAY:PAUSE; btn.setAttribute('aria-label',a.paused?'Play':'Pause');
  }
  // tapping a tile plays it; tapping the one that is playing pauses it
  function pick(i){
    if(i===now){ if(a.paused) a.play(); else a.pause(); return; }
    now=i; var it=S[i];
    document.getElementById('plCover').innerHTML=cover(it);
    document.getElementById('plTitle').textContent=it.title;
    document.getElementById('plTag').textContent=tag(it);
    document.getElementById('plExtra').textContent=it.extra_credit?' '+it.extra_credit+'.':'';
    bar.style.width='0'; cur.textContent='0:00'; dur.textContent='0:00';
    player.hidden=false;
    a.src=it.audio; a.play().catch(function(){});
    mark();
  }
  btn.onclick=function(){ if(now<0) return; if(a.paused) a.play(); else a.pause(); };
  a.onplay=a.onpause=mark;
  a.onended=function(){ bar.style.width='0'; mark(); };
  a.onloadedmetadata=function(){ dur.textContent=fmt(a.duration); };
  a.ontimeupdate=function(){ cur.textContent=fmt(a.currentTime); if(a.duration){ var p=a.currentTime/a.duration*100; bar.style.width=p+'%'; scrub.setAttribute('aria-valuenow',Math.round(p)); } };
  scrub.onclick=function(e){ var r=scrub.getBoundingClientRect(); if(a.duration) a.currentTime=(e.clientX-r.left)/r.width*a.duration; };
  scrub.onkeydown=function(e){ if(!a.duration) return; if(e.key==='ArrowRight') a.currentTime=Math.min(a.duration,a.currentTime+15); if(e.key==='ArrowLeft') a.currentTime=Math.max(0,a.currentTime-15); };
  // ?play=<slug> (from a gift link): that meditation selected in the player, ready to play
  var want=new URLSearchParams(location.search).get('play'), wi=-1;
  S.forEach(function(it,i){ if(it.slug===want) wi=i; });
  if(wi>=0){
    var it=S[wi]; now=wi;
    document.getElementById('plCover').innerHTML=cover(it);
    document.getElementById('plTitle').textContent=it.title;
    document.getElementById('plTag').textContent=tag(it);
    document.getElementById('plExtra').textContent=it.extra_credit?' '+it.extra_credit+'.':'';
    player.hidden=false; a.preload='metadata'; a.src=it.audio; mark();
    if(tiles.children[wi]) tiles.children[wi].scrollIntoView({block:'center'});
  }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const $=id=>document.getElementById(id);
  const nav=$("nav");
  function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // ================= SIDEBAR TOGGLE =================
  function toggleNav(){ nav.classList.toggle('hidden'); nav.classList.toggle('open'); }
  $("menuBtn").addEventListener('click', toggleNav);
  $("collapseBtn").addEventListener('click', toggleNav);

  // ================= RECENTS =================
  const CK="psyche:chats", CC="psyche:current";
  function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }
  let chats=load(CK,[]);
  function renderSidebar(){
    const box=$("recents"), label=$("recentsLabel");
    box.innerHTML="";
    const list=chats.slice().reverse();
    if(!list.length){ label.style.display="none"; return; }
    label.style.display="";
    list.forEach(c=>{
      const d=document.createElement('div');
      d.className="recent";
      d.textContent=c.title||"New conversation";
      d.title=c.title||"";
      d.onclick=()=>{ localStorage.setItem(CC,c.id); location.href="chat.html"; };
      box.appendChild(d);
    });
  }
  function newConversation(){ localStorage.setItem(CC,""); location.href="chat.html"; }
  $("newChat").onclick=newConversation;
  document.querySelectorAll('[data-route]').forEach(el=>{ el.onclick=()=>{ location.href=el.getAttribute('data-route'); }; });

  // ================= AUTH / PROFILE / MEMBER GATE =================
  // Meditations is a member page, like Education: signed out -> auth, free plan -> membership.
  // ?preview=1 (preview.js) bypasses the gate for visual QA.
  const SB_URL="https://hydzekyzbqhcvajnuegh.supabase.co";
  const SB_KEY="sb_publishable_4OMJbKxYkzEapBMABHuThw_E60ZNWEb";
  const sb=supabase.createClient(SB_URL,SB_KEY);
  let profile=null, currentEmail=null;
  function planName(p){ return p==='pro'?'Pro plan':(p==='plus'?'Plus plan':'Free plan'); }
  function isMember(){ return !!(profile && profile.plan && profile.plan!=="free"); }
  function renderAccount(){
    const el=$("account"); if(!el) return;
    const signedIn=!!(profile&&profile.id);
    const name=(profile&&profile.display_name)||"";
    const label=name||currentEmail||"Guest";
    const initial=((label.trim()[0])||"·").toUpperCase();
    const sub=signedIn ? (planName(profile.plan)+" · Upgrade") : "Sign in";
    el.innerHTML='<div class="avatar-dot">'+esc(initial)+'</div><div class="meta">'+esc(label)+'<br><span class="plan">'+esc(sub)+'</span></div>';
    el.onclick=(e)=>{ e.stopPropagation(); if(!signedIn){ location.href="auth.html"; return; } var m=$("acctMenu"); if(m) m.classList.toggle('open'); };
  }
  async function loadProfile(session){
    if(window.PSYCHE_PREVIEW) return;
    if(!(session&&session.user)){ profile=null; renderAccount(); location.replace("auth.html"); return; }
    const uid=session.user.id;
    currentEmail=session.user.email||"";
    const {data,error}=await sb.from("profiles").select("plan,display_name").eq("id",uid).single();
    if(error||!data){ console.error("profile fetch failed:",error); renderAccount(); return; }
    profile={id:uid,plan:data.plan||"free",display_name:data.display_name||""};
    renderAccount();
    if(!isMember()){ location.replace("pricing.html"); }
  }
  if(window.PSYCHE_PREVIEW){
    const p=window.PSYCHE_PREVIEW_PROFILE;
    currentEmail=p.email;
    profile={id:p.id,plan:p.plan,display_name:p.display_name};
    renderAccount();
  } else {
    sb.auth.getSession().then(({data})=>{ currentEmail=data.session&&data.session.user?data.session.user.email:null; loadProfile(data.session); });
    sb.auth.onAuthStateChange((_e,session)=>{ currentEmail=session&&session.user?session.user.email:null; setTimeout(()=>loadProfile(session),0); });
  }

  // ================= ACCOUNT MENU, HELP & FEEDBACK =================
  const acctMenu=$("acctMenu");
  $("acctSettings").onclick=()=>{ location.href="settings.html"; };
  $("acctSignout").onclick=async()=>{ if(window.PSYCHE_PREVIEW){ location.href="index.html"; return; } try{ await sb.auth.signOut(); }catch(e){} location.href="index.html"; };
  document.addEventListener('click',e=>{ if(acctMenu&&!acctMenu.contains(e.target)&&!$("account").contains(e.target)) acctMenu.classList.remove('open'); });
  const fbModal=$("fbModal");
  $("fbCancel").onclick=()=>fbModal.classList.remove('open');
  $("fbSend").onclick=()=>{ const t=$("fbText").value.trim(); if(t){ try{ const f=JSON.parse(localStorage.getItem("psyche:feedback")||"[]"); f.push({text:t,at:new Date().toISOString()}); localStorage.setItem("psyche:feedback",JSON.stringify(f)); }catch(e){} } $("fbText").value=""; fbModal.classList.remove('open'); alert("Thank you — your feedback was recorded."); };

  renderSidebar();
</script>
</body>
</html>
