<!DOCTYPE html>
<html lang="en">
<head>
<script src="preview.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sussuri — Settings</title>
<link rel="stylesheet" href="site.css?v=20261115l">
<style>
  :root{ --cream:#fff; --night:#000; --indigo:#fff; --panel:rgba(0,0,0,0.96); --line:#333; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:var(--font-sans);background:var(--night);color:var(--cream);
    display:flex;height:100dvh;overflow:hidden;
  }

  /* ================= SIDEBAR NAV (universal — identical on every page) ================= */
  nav{
    width: 258px; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0; overflow-y: auto; scrollbar-width: none;
    transition: margin-left 0.25s ease;
    z-index: 5;
  }


































  .fbmodal{ position: fixed; inset: 0; background:rgba(0,0,0,0.62); display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px; }
  .fbmodal.open{ display: flex; }
  .fbcard{ background: var(--panel); border:1px solid #333; border-radius:8px; padding: 22px; max-width: 420px; width: 100%; }
  .fbcard h3{ font-weight: 400; font-size: 22px; margin-bottom: 8px; }
  .fbcard p{ opacity: 0.6; font-size: 15px; margin-bottom: 14px; line-height: 1.4; }
  .fbcard textarea{ width: 100%; min-height: 100px; background:rgba(0,0,0,0.4); border:1px solid #333; border-radius:8px; padding: 12px; color: var(--cream); font-family:var(--font-sans); font-size: 16px; outline: none; resize: none; }
  .fbcard .row{ display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .fbcard .row button{ font-family:var(--font-sans); font-size: 15px; border-radius:8px; padding: 8px 18px; cursor: pointer; }
  .fbcard .ghost{ background: transparent; border:1px solid #4a4a4a; color: var(--cream); }
  .fbcard .primary{ background: var(--cream); border: none; color: var(--night); }

  /* ================= MAIN ================= */
  main{ flex: 1; min-width: 0; overflow-y: auto; }




  /* ===== page content ===== */
  .page{padding:12px 24px 60px;}
  .wrap{max-width:520px;margin:0 auto;}
  h1{font-weight:400;font-size:2rem;margin-bottom:26px;}
  .row{border-top:1px solid #333;padding:18px 2px;}
  .row .lbl{font-style:normal;opacity:.5;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;}
  .row .val{font-size:18px;}
  .actions{margin-top:30px;display:flex;flex-direction:column;gap:12px;}
  button, .linkbtn{font-family:var(--font-sans);font-size:16px;border-radius:8px;padding:12px 22px;cursor:pointer;text-align:center;text-decoration:none;}
  .signout{background:transparent;border:1px solid #4a4a4a;color:#fff;}
  .signout:hover{background:transparent;}
  .danger{background:transparent;border:1px solid rgba(224,120,86,.5);color:#e07856;}
  .danger:hover{background:rgba(224,120,86,.1);}
  .note{opacity:.45;font-style:normal;font-size:14px;margin-top:8px;line-height:1.5;}
/* every page title starts 60px from the top (site.css .page-title) */
@media (min-width:1024px){ .page{padding-top:60px !important;} }
/* phones + tablets: every page title starts 76px from the top (44px top bar + 32) */
@media (max-width:1023px){ .page{padding-top:32px !important;} }

/* ════════ NEW LOOK (design rules, 14 Nov 2026) — appended last so it wins. Look only: no wording or behaviour changes. ════════ */
body{background:#000;color:#fff;font-family:var(--font-jost);font-weight:300;}
main{background:#000 !important;scrollbar-width:thin;scrollbar-color:#666 #000;}
.page{padding:56px 72px 80px !important;} .wrap{max-width:640px;margin:0;}
.wrap .page-title{margin:0 0 36px;}
.row{border-top:1px solid var(--s-rule);padding:18px 0;} .row .lbl{font-family:var(--font-mono);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-label);font-size:11px;opacity:1;margin-bottom:6px;} .row .val{font-size:18px;color:#fff;}
.actions{margin-top:30px;gap:12px;}
.actions button,.actions .linkbtn{height:46px;padding:0 22px;border-radius:8px;font-family:var(--font-jost);font-weight:500;font-size:12.5px;line-height:1;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
.signout{background:#fff;border:1px solid #fff;color:#000;} .signout:hover{background:#e6e6e6;}
.danger{background:transparent;border:1px solid #fff;color:#fff;} .danger:hover{background:#1c1c1c;}   /* red is kept for the Delete account page only */
.note{font-size:15px;color:var(--s-label);opacity:1;}
@media (max-width:1023px){ .page{padding:36px 20px 40px !important;} .wrap .page-title{margin-bottom:24px;} }
</style>
</head>
<body class="site-shell">

<script src="site-header.js?v=20261115l"></script>

<main>
  <div class="page">
    <div class="wrap">
      <h1 class="page-title">Settings</h1>
      <div class="row">
        <div class="lbl">Signed in as</div>
        <div class="val" id="email">—</div>
      </div>
      <div class="row">
        <div class="lbl">Plan</div>
        <div class="val" id="plan">—</div>
      </div>
      <div class="actions">
        <button class="signout" id="signout">Sign out</button>
        <button class="danger" id="del">Delete account</button>
        <div class="note" id="delNote" style="display:none;">Account deletion isn't self-serve yet — email <a href="mailto:hello@sussuri.com" style="color:#fff;">hello@sussuri.com</a> and we'll remove your data promptly.</div>
      </div>
    </div>
  </div>
</main>

<div class="fbmodal" id="fbModal">
  <div class="fbcard">
    <h3>Help &amp; feedback</h3>
    <p>What's working, what isn't, what would make this worth it? Anything helps.</p>
    <textarea id="fbText" placeholder="Type your thoughts&hellip;"></textarea>
    <div class="row">
      <button class="ghost" id="fbCancel">Cancel</button>
      <button class="primary" id="fbSend">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const $=id=>document.getElementById(id);
  const nav=$("nav");
  const sb=supabase.createClient("https://hydzekyzbqhcvajnuegh.supabase.co","sb_publishable_4OMJbKxYkzEapBMABHuThw_E60ZNWEb");
  function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function planName(p){ return p==='pro'?'Pro plan':(p==='plus'?'Plus plan':'Free plan'); }

  // ================= SIDEBAR TOGGLE =================
  function toggleNav(){ nav.classList.toggle('hidden'); nav.classList.toggle('open'); }
  function closeNav(){ if(window.innerWidth<=760){ nav.classList.add('hidden'); nav.classList.remove('open'); } }
  $("menuBtn").addEventListener('click', toggleNav);
  $("collapseBtn").addEventListener('click', toggleNav);

  // ================= RECENTS =================
  const CK="psyche:chats", CC="psyche:current";
  function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }
  let chats=load(CK,[]);
  function renderSidebar(){
    const box=$("recents"), label=$("recentsLabel");
    box.innerHTML="";
    const list=chats.slice().reverse();
    if(!list.length){ label.style.display="none"; return; }
    label.style.display="";
    list.forEach(c=>{
      const d=document.createElement('div');
      d.className="recent";
      d.textContent=c.title||"New conversation";
      d.title=c.title||"";
      d.onclick=()=>{ localStorage.setItem(CC,c.id); location.href="chat.html"; };
      box.appendChild(d);
    });
  }
  function newConversation(){ localStorage.setItem(CC,""); location.href="chat.html"; }
  $("newChat").onclick=newConversation;
  document.querySelectorAll('[data-route]').forEach(el=>{ el.onclick=()=>{ location.href=el.getAttribute('data-route'); }; });

  // ================= ACCOUNT MENU, HELP & FEEDBACK =================
  const acctMenu=$("acctMenu");
  $("acctSettings").onclick=()=>{ location.href="settings.html"; };
  $("acctSignout").onclick=async()=>{ if(window.PSYCHE_PREVIEW){ location.href="index.html"; return; } try{ await sb.auth.signOut(); }catch(e){} location.href="index.html"; };
  document.addEventListener('click',e=>{ if(acctMenu&&!acctMenu.contains(e.target)&&!$("account").contains(e.target)) acctMenu.classList.remove('open'); });
  const fbModal=$("fbModal");
  $("fbCancel").onclick=()=>fbModal.classList.remove('open');
  $("fbSend").onclick=()=>{ const t=$("fbText").value.trim(); if(t){ try{ const f=JSON.parse(localStorage.getItem("psyche:feedback")||"[]"); f.push({text:t,at:new Date().toISOString()}); localStorage.setItem("psyche:feedback",JSON.stringify(f)); }catch(e){} } $("fbText").value=""; fbModal.classList.remove('open'); alert("Thank you — your feedback was recorded."); };

  renderSidebar();

  // ================= PAGE CONTENT + NAV ACCOUNT CHIP =================
  function setNavAccount(name,plan,signedIn){
    const el=$("account"); if(!el) return;
    const initial=((name||"").trim()[0]||"·").toUpperCase();
    el.innerHTML='<div class="avatar-dot">'+esc(initial)+'</div><div class="meta">'+esc(name)+'<br><span class="plan">'+esc(plan+(signedIn?' · manage':''))+'</span></div>';
  }
  if(window.PSYCHE_PREVIEW){
    // Dev preview: mock profile only, no Supabase session is created or read.
    const p=window.PSYCHE_PREVIEW_PROFILE;
    $("email").textContent=p.email;
    $("plan").textContent=planName(p.plan);
    setNavAccount(p.display_name, planName(p.plan), true);
  } else {
    sb.auth.getSession().then(async({data})=>{
      const s=data.session;
      if(!(s&&s.user)){ location.href="auth.html"; return; }
      $("email").textContent=s.user.email||"—";
      const {data:prof}=await sb.from("profiles").select("plan,display_name").eq("id",s.user.id).single();
      const plan=(prof&&prof.plan)||"free";
      $("plan").textContent=planName(plan);
      setNavAccount((prof&&prof.display_name)||s.user.email||"Account", planName(plan), true);
    });
  }

  $("signout").onclick=async()=>{
    if(window.PSYCHE_PREVIEW){ location.href="index.html"; return; }
    try{ await sb.auth.signOut(); }catch(e){} location.href="index.html";
  };
  $("del").onclick=()=>{ $("delNote").style.display="block"; };
</script>
</body>
</html>
