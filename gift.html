<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A gift for you · Sussuri</title>
<!-- The gift page is now the front page with the friend's small card on it (front-v2.html, 24 Nov 2026).
     /g/<id> is served by api/g.js. This file only forwards old gift.html?id=<id> addresses there. -->
<script>
(function(){
  var q=new URLSearchParams(location.search),id=q.get('id')||'',from=q.get('from');
  location.replace(id?'/front-v2?gift='+encodeURIComponent(id)+(from?'&from='+encodeURIComponent(from):''):'/');
})();
</script>
</head>
<body style="background:#000"></body>
</html>
