<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A gift for you · Sussuri</title>
<!--GIFT_META-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/meditation-cover.css?v=20261116a">
<link rel="stylesheet" href="/gift-card.css?v=20261116a">
<style>
  /* The page a friend lands on from a gift link (sussuri.com/g/<id>). No sign-in.
     The card at the top, full size; under it, the gift itself. A "Start my free month" button stays in view. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:#000;color:#fff;font-family:'Jost',-apple-system,'Helvetica Neue',Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  /* the card: wide windows show the front page composition scaled to fit; phones and tall windows the stacked one */
  .top{background:linear-gradient(#000 50%,#fff 50%);}
  .top.tall{background:#fff;}
  .hold{margin:0 auto;}
  .fp .cta{cursor:pointer;}
  .fp .cta:hover{background:#fff;color:#000;outline:1px solid #000;}
  /* the gift */
  .gift-sec{max-width:1100px;margin:0 auto;padding:80px 72px 140px;}
  .lab{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#a8a8a8;}
  .gift-sec h2{font-family:'Poiret One','Jost',sans-serif;font-weight:400;font-size:64px;line-height:1.05;margin:14px 0 18px;}
  .gift-sec .about{font-size:20px;line-height:1.5;color:#d6d6d6;max-width:760px;}
  .med{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:start;margin-top:40px;}
  .med .cv{border:1px solid #333;border-radius:8px;overflow:hidden;}
  .pl{display:flex;align-items:center;gap:20px;margin-top:28px;}
  .round{flex:0 0 auto;width:64px;height:64px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .round svg{width:18px;height:18px;fill:currentColor;}
  .round:focus-visible,.go:focus-visible,.stick:focus-visible{outline:2px solid #808080;outline-offset:3px;}
  .scrub{position:relative;flex:1;height:24px;cursor:pointer;display:flex;align-items:center;}
  .scrub::before{content:"";position:absolute;left:0;right:0;height:2px;background:#4a4a4a;}
  .scrub i{position:relative;display:block;height:2px;width:0;background:#fff;}
  .time{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.14em;color:#a8a8a8;white-space:nowrap;}
  .credit{margin-top:14px;font-size:14px;color:#a8a8a8;}
  .after{margin-top:48px;padding-top:28px;border-top:1px solid #333;display:none;}
  .after.show{display:block;}
  .after p{font-size:20px;line-height:1.5;margin-bottom:20px;max-width:700px;}
  .go{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:8px;background:#fff;color:#000;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;border:1px solid #fff;}
  .go.ghost{background:transparent;color:#fff;}
  .know-go{margin-top:32px;}
  /* stays in view beside the gift */
  .stick{position:fixed;right:24px;bottom:24px;z-index:20;display:none;align-items:center;justify-content:center;height:52px;padding:0 26px;border-radius:8px;background:#fff;color:#000;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 6px 24px rgba(0,0,0,.45);}
  .stick.show{display:inline-flex;}
  .foot{max-width:1100px;margin:0 auto;padding:0 72px 40px;font-size:13px;color:#8a8a8a;display:flex;gap:22px;flex-wrap:wrap;}
  .foot a{color:#8a8a8a;}
  @media (max-width:900px){
    .gift-sec{padding:48px 20px 120px;}
    .gift-sec h2{font-size:40px;}
    .gift-sec .about{font-size:17px;}
    .med{grid-template-columns:1fr;gap:24px;}
    .med .cv{max-width:280px;}
    .stick{left:16px;right:16px;bottom:16px;}
    .foot{padding:0 20px 90px;}
  }
</style>
</head>
<body>
<div class="top" id="top"><div class="hold" id="hold"></div></div>
<section class="gift-sec" id="gift" aria-live="polite"></section>
<footer class="foot"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/urgent.html">Need urgent help?</a></footer>
<a class="stick" id="stick" href="/signup.html">Start my free month</a>

<script src="/meditation-sessions.js?v=20261116a"></script>
<script src="/gift-card.js?v=20261116a"></script>
<script>
(function(){
  // the gift: put in by the server (api/g.js) as window.GIFT, or read from ?id=
  var PLAY = '<path d="M4 2l14 8-14 8z"/>', PAUSE = '<path d="M4 2h4v16H4zM12 2h4v16h-4z"/>';
  var S = window.SUSSURI_SESSIONS || [];
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(t){ t = Math.max(0, t|0); return Math.floor(t/60) + ':' + ('0' + (t%60)).slice(-2); }
  var SAMPLE = {   // preview links (/g/preview-know, -med, -card): nothing saved, shown from "Mark"
    know: { id:'preview-know', kind:'know', from:'Mark', message:'This shows you how your mind works. It’s quick, it’s fun, and it got me thinking. Have a go.' },
    med:  { id:'preview-med', kind:'med', meditation:'fall-asleep', from:'Mark', message:'This one helps me switch off at night. Have a listen.' },
    card: { id:'preview-card', kind:'card', from:'Mark', message:'A calm mind sees clearly. I’ve been using Sussuri to find mine. Try it with me, you get a month free.' }
  };
  async function load(){
    if (window.GIFT) return window.GIFT;
    var id = new URLSearchParams(location.search).get('id') || (location.pathname.match(/\/g\/([^\/?#]+)/) || [])[1] || '';
    if (/^preview-(know|med|card)$/.test(id)) return SAMPLE[id.slice(8)];
    try { var r = await fetch('/api/gift?id=' + encodeURIComponent(id)); if (r.ok) return await r.json(); } catch (e) {}
    return null;
  }
  load().then(function(g){
    if (!g) { location.replace('/'); return; }      // a gift that no longer exists goes to the front page
    // remember which gift brought them here, so the member who gave it is credited if they join (signup.html)
    try { localStorage.setItem('sussuri:gift', JSON.stringify({ id: g.id, at: new Date().toISOString() })); sessionStorage.setItem('sussuri:gift', g.id); } catch (e) {}
    var med = g.kind === 'med' ? S.filter(function(s){ return s.slug === g.meditation; })[0] : null;
    if (g.kind === 'med' && !med) g.kind = 'card';
    card(g, med); giftPart(g, med);
  });

  // ---------- the card ----------
  function card(g, med){
    var top = document.getElementById('top'), hold = document.getElementById('hold'), c = null, isTall = null;
    var medShort = med ? Object.assign({}, med, { about: window.sussuriShort ? window.sussuriShort(med.about) : med.about }) : null;
    var w = window.SussuriCard.words(g.kind, medShort);
    function lay(){
      var vw = document.documentElement.clientWidth, vh = window.innerHeight, tall = vw / vh < 1.3;
      hold.style.width = tall ? '100%' : Math.min(vw, vh * 1440 / 820) + 'px';
      hold.style.aspectRatio = tall ? 'auto' : '1440 / 820';
      top.classList.toggle('tall', tall);
      if (tall !== isTall) {
        isTall = tall; c = window.SussuriCard.make(hold, { tall: tall });
        c.set({ kind: g.kind, from: g.from, gift: w.gift, about: w.about, message: g.message });
        c.el.querySelector('.cta').setAttribute('role', 'button'); c.el.querySelector('.cta').tabIndex = 0;
        c.el.querySelector('.cta').onclick = open;
        c.el.querySelector('.cta').onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
      }
      c.size();
    }
    function open(){
      if (g.kind === 'card') { location.href = '/pricing.html'; return; }                    // a share card: the Join page
      document.getElementById('gift').scrollIntoView({ behavior: 'smooth' });
      if (g.kind === 'med') { var b = document.getElementById('gPlay'); if (b && document.getElementById('gAudio').paused) b.click(); }
    }
    window.addEventListener('resize', lay);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(lay);
    lay();
  }

  // ---------- the gift under the card ----------
  function giftPart(g, med){
    var sec = document.getElementById('gift'), stick = document.getElementById('stick');
    var who = esc(g.from || 'Your friend');
    if (g.kind === 'med') {
      sec.innerHTML =
        '<div class="lab">A gift from ' + who + '</div>' +
        '<div class="med"><div class="cv" aria-hidden="true">' + (window.sussuriCover ? window.sussuriCover(med) : '') + '</div><div>' +
          '<div class="lab">' + esc([med.category, med.length].filter(Boolean).join(' · ')) + '</div>' +
          '<h2>' + esc(med.title) + '</h2>' +
          '<p class="about">' + esc(med.about) + '</p>' +
          '<div class="pl"><button type="button" class="round" id="gPlay" aria-label="Play"><svg viewBox="0 0 20 20" aria-hidden="true">' + PLAY + '</svg></button>' +
            '<div class="scrub" id="gScrub" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="gBar"></i></div>' +
            '<span class="time"><span id="gCur">0:00</span> / <span id="gDur">0:00</span></span></div>' +
          '<p class="credit">Written and narrated by Mark Carpenter' + (med.extra_credit ? ' · ' + esc(med.extra_credit) : '') + '</p>' +
          '<audio id="gAudio" preload="none" src="' + esc(med.audio) + '"></audio>' +
        '</div></div>' +
        '<div class="after" id="after"><p>That was a gift from ' + who + '. There are more meditations like it, a guide to talk to, and the training to reach your goals. One whole month free.</p>' +
          '<a class="go" href="/signup.html">Start my free month</a></div>';
      var a = document.getElementById('gAudio'), b = document.getElementById('gPlay'), bar = document.getElementById('gBar'), sc = document.getElementById('gScrub');
      function mark(){ b.querySelector('svg').innerHTML = a.paused ? PLAY : PAUSE; b.setAttribute('aria-label', a.paused ? 'Play' : 'Pause'); }
      b.onclick = function(){ if (a.paused) a.play().catch(function(){}); else a.pause(); };
      a.onplay = a.onpause = mark;
      a.onloadedmetadata = function(){ document.getElementById('gDur').textContent = fmt(a.duration); };
      a.ontimeupdate = function(){ document.getElementById('gCur').textContent = fmt(a.currentTime); if (a.duration) { var p = a.currentTime / a.duration * 100; bar.style.width = p + '%'; sc.setAttribute('aria-valuenow', Math.round(p)); } };
      a.onended = function(){ mark(); document.getElementById('after').classList.add('show'); document.getElementById('after').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      sc.onclick = function(e){ var r = sc.getBoundingClientRect(); if (a.duration) a.currentTime = (e.clientX - r.left) / r.width * a.duration; };
      sc.onkeydown = function(e){ if (!a.duration) return; if (e.key === 'ArrowRight') a.currentTime = Math.min(a.duration, a.currentTime + 15); if (e.key === 'ArrowLeft') a.currentTime = Math.max(0, a.currentTime - 15); };
    } else if (g.kind === 'know') {
      sec.innerHTML =
        '<div class="lab">A gift from ' + who + '</div>' +
        '<h2>Know yourself</h2>' +
        '<p class="about">Pick the images you are drawn to, answer a few questions, and see a profile of who you really are: how your mind works, and the one thing holding you back. No sign-up needed.</p>' +
        '<div class="know-go"><a class="go" href="/assessment.html?gift=' + encodeURIComponent(g.id) + '">Find out who you really are</a></div>';
    } else {
      sec.innerHTML =
        '<div class="lab">A gift from ' + who + '</div>' +
        '<h2>What is Sussuri?</h2>' +
        '<p class="about">A guide for your mind: coaching, meditations and training that help you feel calm and reach your goals. One whole month free.</p>' +
        '<div class="know-go"><a class="go" href="/pricing.html">Start my free month</a></div>';
    }
    // the button that stays in view: shown once they are past the card
    function onScroll(){ stick.classList.toggle('show', window.scrollY > window.innerHeight * .6); }
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }
})();
</script>
</body>
</html>
