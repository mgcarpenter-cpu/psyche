<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;}
  body{display:flex;align-items:center;justify-content:center;}
  .phone{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden;}
  #panda{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;}
  .scrim{position:absolute;left:0;right:0;bottom:0;height:60%;
    background:linear-gradient(transparent,rgba(6,9,15,.85));pointer-events:none;}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;
    gap:14px;height:58px;padding:0 20px;background:linear-gradient(rgba(6,9,15,.55),transparent);pointer-events:none}
  .menu-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
  .menu-btn span{display:block;width:18px;height:1px;background:#e8e4dc;opacity:.7;box-shadow:0 1px 4px rgba(0,0,0,.9)}
  .mark{font-family:'Cinzel',serif;font-weight:500;font-size:17px;letter-spacing:.32em;text-indent:.32em;color:#e8e4dc;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .slider{position:absolute;left:0;right:0;bottom:3%;height:50%;overflow:hidden;}
  .track{display:flex;height:100%;gap:14px;transform:translateX(0);
    transition:transform .8s cubic-bezier(.4,0,.2,1);will-change:transform;}
  .card{flex:0 0 auto;height:100%;width:31vh;border-radius:16px;overflow:hidden;
    border:1px solid rgba(244,242,238,.14);box-shadow:0 10px 40px rgba(0,0,0,.6);background:#06090f;}
  .card img,.card video{display:block;height:100%;width:100%;object-fit:cover;object-position:center;}
  #playBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:84px;height:84px;border-radius:50%;background:#fff;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.55);z-index:5;}
  #playBtn svg{margin-left:5px;}
  #playBtn.hidden{display:none;}
  html.ap #playBtn{display:none;}
  html.ap.blocked #playBtn{display:flex;}
</style></head><body>

  <button id="playBtn" aria-label="Play">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="#06090f"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>
<script>
  var track=document.getElementById('track');
  var panda=document.getElementById('panda');
  var playBtn=document.getElementById('playBtn');
  var slider=document.querySelector('.slider');
  var cards=Array.prototype.slice.call(track.querySelectorAll('.card'));
  var vids=[document.getElementById('c0'),null,document.getElementById('c2'),null];
  var meta=[
    {kind:'video', sound:true,  intro:2500},
    {kind:'image', dwell:6000},
    {kind:'video', sound:false, dwell:6507},
    {kind:'image', dwell:6000}
  ];
  var i=0, timer=null, running=false;
  function clearT(){ if(timer){clearTimeout(timer);timer=null;} }
  function center(idx){
    var card=cards[idx];
    var cc=slider.clientWidth/2, cd=card.offsetLeft+card.offsetWidth/2;
    track.style.transform='translateX('+(cc-cd)+'px)';
  }
  function resetOthers(active){
    vids.forEach(function(v,j){ if(v && j!==active){ try{v.pause();v.currentTime=0;}catch(e){} } });
  }
  function show(idx){
    i=idx; center(i); clearT(); resetOthers(i);
    var m=meta[i];
    if(m.kind==='image'){
      if(panda.paused){ try{panda.play();}catch(e){} }
      timer=setTimeout(next, m.dwell);
    } else {
      var v=vids[i];
      if(m.sound){
        if(panda.paused){ try{panda.play();}catch(e){} }
        timer=setTimeout(function(){
          panda.pause();
          v.currentTime=0; v.muted=false;
          var p=v.play(); if(p&&p.catch)p.catch(function(){});
          v.onended=function(){ v.onended=null; next(); };
        }, m.intro||0);
      } else {
        if(panda.paused){ try{panda.play();}catch(e){} }
        v.currentTime=0; v.muted=true;
        var p2=v.play(); if(p2&&p2.catch)p2.catch(function(){});
        timer=setTimeout(next, m.dwell);
      }
    }
  }
  function next(){
    if(i===cards.length-1){
      try{ if(window.parent!==window){ window.parent.postMessage('psyche:done','*'); return; } }catch(e){}
      show(0); return;
    }
    show(i+1);
  }
  function start(){
    if(running) return; running=true;
    playBtn.classList.add('hidden');
    document.documentElement.classList.remove('blocked');
    panda.muted=false; panda.currentTime=0;
    var p=panda.play();
    if(p&&p.then){
      p.then(function(){ show(0); }).catch(function(){
        running=false;
        // unmuted blocked: surface the button; a real tap will succeed
        document.documentElement.classList.add('blocked');
        playBtn.classList.remove('hidden');
      });
    } else { show(0); }
  }
  window.addEventListener('resize', function(){center(i);});
  requestAnimationFrame(function(){center(0);});
  playBtn.addEventListener('click', start);
  window.addEventListener('load',function(){
    if(!window.__AUTOPLAY__ && !/[?&]autoplay=1/.test(location.search)) return;
    start();
  });
</script>
