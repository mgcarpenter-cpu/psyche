<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sussuri wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="site.css?v=20261116a">
<style>
/* One fixed composition, 1440 x 820, scaled as a single piece to fit the window.
   The join between black and white sits at 410. Nothing reflows, so it always sits the same. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#000;overflow:hidden;color-scheme:light}
#stage{position:absolute;left:0;top:0;width:1440px;height:820px;transform-origin:0 0;font:300 17px/1.6 'Jost',system-ui,sans-serif;color:#000}
#wheel{position:absolute;left:18.6px;top:calc(97.4px + var(--dy,0px));width:625.2px;height:625.2px;display:block;opacity:0;transition:opacity 1.2s ease}
#stage.ready #wheel{opacity:1}
.rotO,.rotI{transition:transform 1.3s cubic-bezier(.45,.05,.25,1)}
#stage.intro .rotO,#stage.intro .rotI{transition:transform 2.6s cubic-bezier(.4,0,.2,1)}
#stage.snap .rotO,#stage.snap .rotI{transition:none}
.ln{fill:none;stroke:#f4f4f4;stroke-width:1}
.ln.f{stroke-width:.7}
.dots circle{fill:#f4f4f4}
.dial circle,.dial path{fill:none;stroke-width:.8}
.dup circle,.dup path{stroke:#8a8a8a}
.dlow circle,.dlow path{stroke:#777}
.dial .reg{stroke-width:.7}
.dlow .reg{stroke:#000;opacity:.4}
.hit{fill:transparent}
.seg{cursor:pointer}
.lit{fill:#f4f4f4;opacity:0;transition:opacity .3s ease}
.seg.on .lit{opacity:1;transition:opacity .45s ease}
.lbl{font:400 22px 'Poiret One',Georgia,serif;letter-spacing:4px;fill:#f4f4f4;opacity:0;transition:opacity .35s ease,fill .3s ease}
.lbl.show{opacity:1}
.seg.on .lbl{fill:#000;font-size:25px;transition:opacity .35s ease,fill .45s ease}
h1{position:absolute;left:40px;top:calc(24.6px + var(--ny,0px));margin:0;font:400 328px/1 'Poiret One',Georgia,serif;letter-spacing:16.4px;color:#f4f4f4;white-space:nowrap;z-index:2;pointer-events:none}
.menu{position:absolute;left:39.5px;top:38px;z-index:4}
.menubtn{width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer}
.menubtn{-webkit-tap-highlight-color:transparent}
.menubtn:focus{outline:none}
.menubtn:focus-visible{outline:2px solid #808080;outline-offset:3px}
.bars{width:24px;height:14px;border-top:1.5px solid #f4f4f4;border-bottom:1.5px solid #f4f4f4;position:relative}
.bars::after{content:"";position:absolute;left:0;right:0;top:50%;margin-top:-.75px;border-top:1.5px solid #f4f4f4}
.panel{position:absolute;left:0;top:56px;min-width:220px;padding:8px;border:1px solid #6b6b6b;border-radius:12px;background:#000;display:flex;flex-direction:column}
.panel[hidden]{display:none}
.panel a{color:#f4f4f4;text-decoration:none;font-size:17px;min-height:44px;padding:0 12px;display:flex;align-items:center;border-radius:8px}
.panel a:hover{background:#1c1c1c}
#line{position:absolute;left:520px;top:calc(556.4px + var(--dy,0px));width:237.3px;height:1px;background:#000;transform:scaleX(0);transform-origin:0 50%;transition:transform .7s cubic-bezier(.45,.05,.3,1)}
#stage.lineon #line{transform:none}
#box{position:absolute;left:757.3px;top:calc(455px + var(--dy,0px) + var(--bs,0px));width:631.2px;height:306px;padding:22px 36px 24px}
#box::before,#box::after,.cn::before,.cn::after{content:"";position:absolute;width:16px;height:16px;border:1px solid #000}
#box::before{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:7px}
#box::after{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:7px}
.cn::before{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:7px}
.cn::after{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:7px}
.row{display:flex;justify-content:space-between;align-items:center;height:12px;font:400 12px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:1.68px;text-transform:uppercase}
#name{display:block;margin:6px 0 0;height:92px;font:400 92.16px/1 'Poiret One',Georgia,serif;letter-spacing:.06em;white-space:nowrap}
#desc{margin:2.2px 0 0;height:33.6px;font-size:23px;line-height:33.6px;white-space:nowrap}
#idx,#name,#desc{transition:opacity .25s ease}
#box.out #idx,#box.out #name,#box.out #desc{opacity:0}
#desc.typing::after{content:"";display:inline-block;width:.45em;height:.95em;margin-left:3px;vertical-align:-.12em;background:currentColor;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#points{list-style:none;margin:18px 0 0;padding:14px 0 0;border-top:1px solid #d9d9d9;font-size:17px;line-height:27.2px}
#points li::before{content:"\2014";margin-right:12px;color:#6a6a6a}
.cta{position:absolute;right:36px;bottom:26px;height:46px;border-radius:8px;padding:0 22px;display:flex;align-items:center;background:#000;color:#fff;font:500 12.5px/1 'Jost',system-ui,sans-serif;letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;text-decoration:none;border:1px solid #000;transition:background-color .2s ease,color .2s ease}
.cta:hover{background:#fff;color:#000}

/* Tall windows (side panels, tablets held upright, phones): the same pieces, stacked.
   Name across the top, wheel centred on the join, words underneath. Sizes are set from the window by the script. */
.tall h1{left:var(--m);top:calc(var(--J) - var(--a) - var(--F) * .88);font-size:var(--F);letter-spacing:calc(var(--F) * .05)}
.tall #wheel{left:calc(var(--W) / 2 - var(--R) * 1.2824);top:calc(var(--J) - var(--R) * 1.2824);width:calc(var(--R) * 2.5649);height:calc(var(--R) * 2.5649)}
.tall .reg{display:none}
.tall .menu{left:calc(var(--m) + var(--F) * .035 - 12px);top:var(--mt)}
.tall #line{left:calc(var(--W) / 2);top:calc(var(--J) + var(--R));width:1px;height:calc(var(--bt) - var(--J) - var(--R));transform:scaleY(0);transform-origin:50% 0}
#stage.tall.lineon #line{transform:none}
.tall #box{left:calc((var(--W) - var(--bw)) / 2);top:var(--bt);width:var(--bw);height:auto;padding:var(--bp) calc(var(--bp) * 1.5) calc(var(--bp) * 1.1)}
.tall .row{font-size:var(--ms);height:var(--ms);letter-spacing:.14em}
.tall #name{font-size:var(--hs);height:var(--hs);margin-top:calc(var(--hs) * .1)}
.tall #desc{font-size:var(--ds);line-height:1.4;height:calc(var(--ds) * 1.4 * var(--dl));white-space:normal;margin-top:calc(var(--ds) * .25)}
.tall #points{font-size:var(--ls);line-height:1.6;margin-top:calc(var(--ls) * .9);padding-top:calc(var(--ls) * .75)}
.tall .cta{right:calc(var(--bp) * 1.5);bottom:calc(var(--bp) * 1.1);height:calc(var(--ls) * 3.1);font-size:calc(var(--ls) * .82);padding:0 calc(var(--ls) * 1.6)}
.tall.stack .cta{position:static;margin-top:calc(var(--ls) * 1.1);justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible{outline:2px solid #808080;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rotO,.rotI,#wheel,.lit,.lbl,#line,#idx,#name,#desc{transition:none!important}#desc.typing::after{animation:none}}
</style>
</head>

<h1>sussuri</h1>
<div class="menu">
<button class="menubtn" type="button" id="menubtn" aria-expanded="false" aria-controls="nav" aria-label="Menu"><span class="bars" aria-hidden="true"></span></button>
</div>
<div id="line" aria-hidden="true"></div>
<section id="box" class="out" aria-label="About Sussuri">
<span class="cn" aria-hidden="true"></span>
<div class="row"><span id="idx">01 / 08</span><span>AI powered</span></div>
<b id="name" aria-hidden="true">Talk</b>
<p id="desc" aria-hidden="true"></p>
<p class="sr" id="say" aria-live="polite"></p>
<ul id="points"><li>Speak or type, day or night</li><li>Private and secure</li><li>Free to start</li></ul>
<a class="cta" href="#download">Download free</a>
</section>
</div>
<script src="site-header.js?v=20261121a" data-drawer></script>
<script>
(function(){
  var W=1440,H=820,N=8,STEP=45,REST=135,EVERY=7300,isTall=false;
  var PARTS=[['Talk','A wise AI guide, by voice or text, any time'],['Meditate','Guided meditations for sleep, calm, focus and confidence'],['Learn','A course on how your mind works'],['Earn','Share Sussuri and earn on everyone who joins through you'],['Clarity','See where you are and what to do next'],['Calm','A settled mind and body in minutes'],['Insight','Understand your mind and live a better life'],['Freedom','An income that grows as you share']];
  var stage=document.getElementById('stage'),box=document.getElementById('box'),idx=document.getElementById('idx'),nameEl=document.getElementById('name'),desc=document.getElementById('desc'),say=document.getElementById('say');
  var rotO=[].slice.call(document.querySelectorAll('.rotO')),rotI=[].slice.call(document.querySelectorAll('.rotI')),segs=[].slice.call(document.querySelectorAll('.seg'));
  var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var k=0,token=0,timer=null,typeTok=0;
  function mod(a){return ((a%N)+N)%N;}

  function clamp(a,x,b){return Math.max(a,Math.min(x,b));}
  function setv(o){Object.keys(o).forEach(function(q){stage.style.setProperty('--'+q,typeof o[q]==='number'?o[q]+'px':o[q]);});}
  /* wide windows: one fixed composition scaled as a single piece. tall windows: the stacked arrangement, sized from the window. */
  function layout(){
    var vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight,tall=vw/vh<1.3,j;
    if(tall!==isTall){
      isTall=tall;REST=tall?180:135;
      stage.classList.add('snap');stage.classList.toggle('tall',tall);if(!tall){stage.classList.remove('stack');}
      turn(k*STEP+REST,REST-k*STEP);labels();void stage.getBoundingClientRect();stage.classList.remove('snap');
    }
    if(!tall){
      /* the join sits at half the window's height; the menu stays at the top, the name and wheel hang off the join,
         and the box centres in the white half, so squarer windows use their height instead of floating */
      var u=Math.min(vw/W,vh/H),x=Math.max(0,(vw-W*u)/2),hs=vh/u,extra=Math.max(0,hs-H);
      stage.style.width=W+'px';stage.style.height=hs+'px';
      stage.style.transform='translate('+x+'px,0) scale('+u+')';
      setv({dy:extra/2,ny:extra/4,bs:7+extra/4});
      j=Math.round((H/2+extra/2)*u);
    }else{
      var s=1,w,h,J=0;
      for(var it=0;it<4;it++){
        w=vw/s;h=vh/s;
        var m=clamp(16,w*.04,40),F=Math.min((w-2*m)/2.93,h*.3),R=Math.min((w/2-10)/1.168,h*.2,w*.36),a=F*.3,mt=clamp(10,h*.022,30),
            bw=Math.min(w-2*m,640),stack=bw<520,bp=clamp(16,w*.03,24),hs=clamp(44,w*.085,76),ds=clamp(16,w*.024,22),ls=clamp(14.5,w*.018,17),ms=clamp(10.5,w*.013,12),
            dl=(56*.445*ds+ds)>(bw-3*bp)?2:1,g=clamp(14,h*.02,28);
        stage.classList.toggle('stack',stack);
        stage.style.width=w+'px';stage.style.height=h+'px';
        setv({W:w,m:m,F:F,R:R,a:a,mt:mt,bw:bw,bp:bp,hs:hs,ds:ds,ls:ls,ms:ms,dl:String(dl),J:0,bt:0});
        var bh=box.offsetHeight,top=Math.max(mt+52+F*.46+a,4+F*.61+a),bot=R*1.168+g+bh+m,spare=h-top-bot;
        if(spare>=0||it===3){spare=Math.max(0,spare);J=top+spare*.45;setv({J:J,bt:J+R*1.168+g+spare*.12});break;}
        s*=h/(top+bot)*.995;
      }
      stage.style.transform='scale('+s+')';
      j=Math.round(J*s);
    }
    document.body.style.background='linear-gradient(#000 '+j+'px,#fff '+j+'px)';
  }
  function turn(o,i){
    rotO.forEach(function(g){g.style.transform='rotate('+o+'deg)';});
    rotI.forEach(function(g){g.style.transform='rotate('+i+'deg)';});
  }
  /* each word has an upright copy for the top half and one for the bottom half */
  function labels(){
    segs.forEach(function(s){
      var th=mod2(REST+STEP*(k-(+s.getAttribute('data-i')))),top=th<=90||th>=270;
      s.querySelector('.up').classList.toggle('show',top);
      s.querySelector('.dn').classList.toggle('show',!top);
    });
  }
  function mod2(a){return ((a%360)+360)%360;}
  function type(text){
    var my=++typeTok,n=0;
    if(still){desc.textContent=text;return;}
    desc.textContent='';desc.classList.add('typing');
    (function step(){
      if(my!==typeTok){return;}
      n+=1;desc.textContent=text.slice(0,n);
      if(n<text.length){setTimeout(step,22);}else{setTimeout(function(){if(my===typeTok){desc.classList.remove('typing');}},1600);}
    })();
  }
  function fill(){
    var i=mod(k),p=PARTS[i];
    idx.textContent=('0'+(i+1)).slice(-2)+' / 08';
    nameEl.textContent=p[0];
    say.textContent=p[0]+'. '+p[1];
    segs[i].classList.add('on');
    stage.classList.add('lineon');
    box.classList.remove('out');
    type(p[1]);
  }
  function go(to){
    var my=++token,arrive=still?0:1450;
    segs.forEach(function(s){s.classList.remove('on');});
    k=to;
    turn(k*STEP+REST,REST-k*STEP);
    setTimeout(function(){if(my===token){labels();}},still?0:650);
    setTimeout(function(){if(my===token){typeTok++;desc.classList.remove('typing');box.classList.add('out');}},still?0:arrive-280);
    setTimeout(function(){if(my===token){fill();}},arrive);
  }
  function start(){stop();if(!still){timer=setInterval(function(){if(!document.hidden){go(k+1);}},EVERY);}}
  function stop(){if(timer){clearInterval(timer);timer=null;}}
  segs.forEach(function(s){
    s.addEventListener('click',function(){
      var d=mod(+s.getAttribute('data-i')-k);if(d>N/2){d-=N;}
      if(d!==0){go(k+d);start();}
    });
  });

  /* opening: the wheel fades in while its rings ease a short way in opposite directions and settle */
  function open(){
    labels();
    if(still){turn(REST,REST);stage.classList.add('ready');fill();return;}
    stage.classList.add('snap');turn(REST-90,REST+135);
    void stage.getBoundingClientRect();
    stage.classList.remove('snap');stage.classList.add('intro','ready');
    turn(REST,REST);
    setTimeout(function(){stage.classList.remove('intro');fill();start();},2700);
  }
  layout();window.addEventListener('resize',layout);
  var opened=false;function once(){if(!opened){opened=true;open();}}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(once);setTimeout(once,1800);}else{once();}

  // the three lines open the app's own menu (site-header.js, drawer mode)
  var menuBtn=document.getElementById('menubtn');
  menuBtn.addEventListener('click',function(e){e.stopPropagation();if(window.sussuriMenu){window.sussuriMenu.toggle();}});
  if(window.sussuriMenu){window.sussuriMenu.onChange(function(o,byKey){menuBtn.setAttribute('aria-expanded',String(o));if(!o&&byKey){menuBtn.focus();}});}
})();
</script>
