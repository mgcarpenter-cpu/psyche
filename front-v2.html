<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psyche</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{ --night:#06090f; --bone:#e8e4dc; --mute:#8a93a3; --rim:rgba(232,228,220,.16);
    --psy-ig:linear-gradient(180deg,#3a5fce 0%,#1d3891 55%,#132a6b 100%); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--bone);font-family:'Cormorant Garamond',Georgia,serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .layer{position:fixed;inset:0;overflow:hidden}

  /* ===== header (standard) ===== */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;
    gap:14px;height:58px;padding:0 20px;background:linear-gradient(rgba(6,9,15,.55),transparent);
    transition:opacity .6s}
  .menu-btn{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:4px}
  .menu-btn span{display:block;width:18px;height:1px;background:var(--bone);opacity:.7;box-shadow:0 1px 4px rgba(0,0,0,.9)}
  .menu-btn:hover span{opacity:1}
  .mark{font-family:'Cinzel',serif;font-weight:500;font-size:17px;letter-spacing:.32em;text-indent:.32em;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .spacer{flex:1}
  .login{font-size:16px;font-weight:300;color:var(--bone);opacity:.68;text-decoration:none;text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .login:hover{opacity:1}

  /* ===== stage 1: lion hero ===== */
  #hero{z-index:40;background:#000;transition:opacity 1.1s ease}
  #hero video,#hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #hero .poster{background:center/cover no-repeat}
  #hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,15,.35) 0%,rgba(6,9,15,0) 30%,rgba(6,9,15,0) 65%,rgba(6,9,15,.55) 100%)}
  .playbtn{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);z-index:6;
    width:78px;height:78px;border-radius:50%;border:1px solid rgba(232,228,220,.4);
    background:rgba(6,9,15,.28);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.4s}
  .playbtn:hover{background:rgba(232,228,220,.16);border-color:var(--bone);box-shadow:0 0 44px rgba(232,228,220,.22)}
  .playbtn svg{margin-left:4px}
  .skip{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:6;
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:var(--bone);opacity:0;
    cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.9);transition:opacity .5s;pointer-events:none}
  .skip.show{opacity:.7;pointer-events:auto}
  .vskip{z-index:3}
  #viewer.on .vskip{opacity:.7;pointer-events:auto}
  #viewer.on .vskip:hover{opacity:1}
  .skip:hover{opacity:1}
  .herojoin{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:7;
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.26em;text-indent:.26em;
    padding:15px 40px;border-radius:4px;color:#fff;text-decoration:none;background:var(--psy-ig);
    box-shadow:0 8px 30px rgba(29,56,145,.5);transition:.4s;white-space:nowrap}
  .herojoin:hover{filter:brightness(1.1)}

  /* ===== stage 2: carousel ===== */
  #carousel{z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1s ease .1s}
  #carousel.on{opacity:1;pointer-events:auto}
  .track{position:relative;width:100%;height:70vh;max-height:640px;display:flex;align-items:center;justify-content:center;
    touch-action:pan-y}
  .card{position:absolute;width:min(82vw,420px);aspect-ratio:3/4;border-radius:16px;overflow:hidden;
    border:1px solid var(--rim);cursor:pointer;
    transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s,filter .5s;
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card .cveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,15,0) 45%,rgba(6,9,15,.85) 100%)}
  .card .clabel{position:absolute;left:0;right:0;bottom:22px;text-align:center;
    font-family:'Cinzel',serif;font-size:15px;letter-spacing:.16em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9)}
  .card .cplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:52px;height:52px;border-radius:50%;border:1px solid rgba(232,228,220,.4);
    background:rgba(6,9,15,.28);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .4s}
  .card .cplay svg{margin-left:3px}
  .card.soon .cplay{border:none;background:none;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;
    color:var(--bone);width:auto;height:auto;padding:6px 12px;border:1px solid var(--rim);border-radius:20px}
  /* positions set via JS: data-pos = -1 | 0 | 1 */
  .card[data-pos="0"]{transform:translateX(0) scale(1);opacity:1;z-index:3;filter:none}
  .card[data-pos="0"] .cplay{opacity:1}
  .card[data-pos="-1"]{transform:translateX(-72%) scale(.78);opacity:.42;z-index:2;filter:brightness(.7) saturate(.85)}
  .card[data-pos="1"]{transform:translateX(72%) scale(.78);opacity:.42;z-index:2;filter:brightness(.7) saturate(.85)}
  .card[data-pos="-2"]{transform:translateX(-120%) scale(.6);opacity:0;z-index:1}
  .card[data-pos="2"]{transform:translateX(120%) scale(.6);opacity:0;z-index:1}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;border:none;
    opacity:.8;transition:opacity .3s}
  .arrow:hover{opacity:1}
  .arrow.left{left:4px} .arrow.right{right:4px}
  .arrow.hide{opacity:0;pointer-events:none}
  .arrow svg{filter:drop-shadow(0 1px 6px rgba(0,0,0,.85))}
  .dots{display:flex;gap:9px;margin-top:26px}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(232,228,220,.25);transition:.3s;cursor:pointer}
  .dot.active{background:var(--bone);width:20px;border-radius:4px}
  .cjoin{margin-top:30px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.26em;text-indent:.26em;
    padding:15px 40px;border-radius:4px;color:#fff;text-decoration:none;background:var(--psy-ig);
    box-shadow:0 8px 30px rgba(29,56,145,.5);transition:.4s}
  .cjoin:hover{filter:brightness(1.1)}

  /* ===== stage 3: fullscreen viewer ===== */
  #viewer{z-index:80;background:#000;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transform:scale(.9);transition:opacity .45s ease,transform .45s cubic-bezier(.3,0,.2,1)}
  #viewer.on{opacity:1;pointer-events:auto;transform:scale(1)}
  #viewer iframe{width:100%;height:100%;border:0;background:#000}
  #viewer .vclose{position:absolute;top:16px;right:18px;z-index:2;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(232,228,220,.4);background:rgba(6,9,15,.4);color:var(--bone);font-size:20px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:90;
    background:rgba(6,9,15,.9);border:1px solid var(--rim);border-radius:24px;padding:11px 22px;
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;color:var(--bone);
    opacity:0;pointer-events:none;transition:opacity .4s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="mark">PSYCHE</div>
  <div class="spacer"></div>
  <a class="login" href="auth.html">log in</a>
</div>

<!-- STAGE 3: VIEWER -->
<div class="layer" id="viewer">
  <button class="vclose" id="vclose">&times;</button>
  <iframe id="viewFrame" allow="autoplay; fullscreen; microphone" frameborder="0"></iframe>
</div>

<div class="toast" id="toast">TRAILER COMING SOON</div>

<script>
  var hero=document.getElementById('hero'), lionVid=document.getElementById('lionVid'),
      lionPlay=document.getElementById('lionPlay'), skip=document.getElementById('skip'),
      carousel=document.getElementById('carousel'), track=document.getElementById('track'),
      cards=[].slice.call(track.querySelectorAll('.card')), dotsWrap=document.getElementById('dots'),
      viewer=document.getElementById('viewer'), viewFrame=document.getElementById('viewFrame'),
      vclose=document.getElementById('vclose'), toast=document.getElementById('toast');
  var center=1, audioUnlocked=false;

  // build dots
  cards.forEach(function(c,i){var d=document.createElement('div');d.className='dot';d.onclick=function(){go(i)};dotsWrap.appendChild(d);});
  var dots=[].slice.call(dotsWrap.children);

  function layout(){
    cards.forEach(function(c,i){c.setAttribute('data-pos', String(i-center));});
    dots.forEach(function(d,i){d.classList.toggle('active', i===center);});
    var aL=document.getElementById('arrowL'), aR=document.getElementById('arrowR');
    if(aL)aL.classList.toggle('hide', center===0);
    if(aR)aR.classList.toggle('hide', center===cards.length-1);
  }
  function go(i){ center=Math.max(0,Math.min(cards.length-1,i)); layout(); }
  document.getElementById('arrowL').onclick=function(){go(center-1);};
  document.getElementById('arrowR').onclick=function(){go(center+1);};
  layout();

  // ---- STAGE 1: play lion ----
  lionPlay.onclick=function(){
    lionVid.muted=false; audioUnlocked=true;
    var p=lionVid.play();
    lionPlay.style.display='none';
    skip.classList.add('show');
    if(p&&p.catch)p.catch(function(){/* if blocked, still allow skip */});
  };
  lionVid.addEventListener('ended', toCarousel);
  skip.onclick=toCarousel;

  function toCarousel(){
    if(carousel.classList.contains('on'))return;
    try{lionVid.pause();}catch(e){}
    hero.style.opacity='0';               // fade lion to black
    setTimeout(function(){
      hero.style.display='none';
      carousel.classList.add('on');
    }, 1100);
  }

  // ---- STAGE 2: swipe/drag ----
  var startX=0,dragging=false;
  track.addEventListener('pointerdown',function(e){dragging=true;startX=e.clientX;});
  window.addEventListener('pointerup',function(e){
    if(!dragging)return;dragging=false;
    var dx=e.clientX-startX;
    if(dx<-40)go(center+1); else if(dx>40)go(center-1);
  });

  // tap centered card -> open viewer
  cards.forEach(function(c,i){
    c.addEventListener('click',function(e){
      if(i!==center){go(i);return;}           // side card -> just center it
      if(c.classList.contains('soon')){ showToast(); return; }
      openViewer(c.getAttribute('data-vid'));
    });
  });

  function openViewer(src){
    viewFrame.src = src + (src.indexOf('?')<0 ? '?autoplay=1' : '&autoplay=1');
    viewer.classList.add('on');
  }
  function closeViewer(){
    viewer.classList.remove('on');
    // blanking the src stops the trailer and kills its audio
    setTimeout(function(){try{viewFrame.src='about:blank';}catch(e){}},450);
  }
  vclose.onclick=closeViewer;
  window.addEventListener('message',function(e){ if(e && e.data==='psyche:done') closeViewer(); });

  var toastT;
  function showToast(){toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('show');},1800);}

  // dev: jump straight to a stage for previewing  (#carousel / #viewer)
  if(location.hash==='#carousel'){hero.style.display='none';carousel.classList.add('on');}
  if(location.hash==='#viewer'){hero.style.display='none';carousel.classList.add('on');viewer.classList.add('on');}
</script>
