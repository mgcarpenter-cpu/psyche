<!DOCTYPE html>
<html lang="en">
<head>
<script src="preview.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Urgent help · Sussuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="site.css?v=20261011t">
<style>
  :root{
    --cream:#faf8f3; --night:#06090f; --indigo:#1d3891;
    --bone:#e8e4dc; --bone-dim:#9aa0ab; --bone-faint:#5f6572;
    --hair:rgba(237,230,220,.14); --hairline:1px solid rgba(237,230,220,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{-webkit-font-smoothing:antialiased;font-family:'Jost',sans-serif;font-weight:300;background:var(--night);}
  a{color:inherit;}

  .screen{min-height:100vh;min-height:100dvh;background:var(--night);color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;position:relative;}
  .close{position:absolute;top:24px;right:28px;color:var(--bone-faint);font-weight:300;font-size:14px;cursor:pointer;text-decoration:none;}
  .close:hover{color:var(--bone);}

  .wrap{max-width:560px;width:100%;text-align:center;}
  .wm{font-size:13px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--bone-faint);margin-bottom:44px;}
  h1{font-family:'Poiret One';font-weight:400;font-size:clamp(34px,4.6vw,48px);line-height:1.15;color:var(--cream);margin-bottom:18px;}
  .lede{font-weight:300;font-style:italic;font-size:16px;line-height:1.6;color:var(--bone-dim);margin-bottom:10px;}
  .sub{font-weight:300;font-size:14px;color:var(--bone-faint);margin-bottom:36px;}

  .primary{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 42px;background:var(--cream);color:#000;font-size:14px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;transition:opacity .18s;}
  .primary:hover{opacity:.92;}
  .primary-note{font-weight:300;font-size:13px;color:var(--bone-faint);margin:14px 0 36px;}

  .danger{border:var(--hairline);padding:22px 26px;margin-bottom:32px;}
  .danger .t{font-family:'Poiret One';font-weight:400;font-size:20px;color:var(--cream);margin-bottom:7px;}
  .danger .d{font-weight:300;font-size:14px;color:var(--bone-dim);line-height:1.55;}
  .emerg{display:inline-block;margin-top:15px;border:var(--hairline);padding:13px 24px;font-weight:300;font-size:13.5px;letter-spacing:.06em;color:var(--bone);cursor:pointer;text-decoration:none;transition:border-color .18s;}
  .emerg:hover{border-color:rgba(237,230,220,.4);}

  .closing{font-weight:300;font-size:14.5px;line-height:1.65;color:var(--bone-dim);max-width:460px;margin:0 auto 34px;}
  .back{color:var(--bone-dim);font-weight:300;font-size:14px;text-decoration:underline;cursor:pointer;}
  .back:hover{color:var(--bone);}

  @media(max-width:560px){ h1{font-size:1.7rem;} .screen{padding:40px 22px;} }
/* every page title starts 60px from the top (site.css .page-title) */
@media (min-width:1024px){ .screen{justify-content:flex-start !important;align-items:center !important;padding-top:60px !important;} .screen > .wrap{margin-top:0 !important;} }
/* simplified (11 Oct 2026): title fixed at the top; the two sections share the rest of the screen evenly */
.wrap{display:flex;flex-direction:column;align-items:center;min-height:calc(100dvh - 120px);}
.lede{font-style:normal !important;margin:22px 0 0 !important;}
.choices{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;width:100%;padding:clamp(24px,5vh,72px) 0;}
.choice{display:flex;flex-direction:column;align-items:center;width:min(340px,100%);}
.choice-label{margin:0 0 20px;font-weight:400;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim);}
.choices .primary{width:100%;}
.divider{width:min(340px,100%);height:1px;background:rgba(237,230,220,.14);}
@media (max-width:1023px){ .wrap{min-height:calc(100dvh - 44px - 80px);} }
/* phones + tablets: title 76px from the top like every page; Close hidden (it sat on the title) */
@media (max-width:1023px){ .screen{justify-content:flex-start !important;padding-top:32px !important;min-height:calc(100dvh - 44px) !important;} .close{display:none !important;} }
</style>
</head>
<body class="site-shell">
<script src="site-header.js?v=20261011t" data-toggle></script>
<main class="site-main">
  <div class="screen">
    <a class="close sans" href="index.html" id="closeBtn" onclick="if(history.length>1){history.back();return false;}">✕ Close</a>

    <div class="wrap">

      <h1 class="page-title">You don’t have to<br>carry this alone.</h1>
      <p class="lede sans">Sussuri isn't emergency support. Please talk to a real person.</p>
      <div class="choices">
        <section class="choice">
          <p class="choice-label sans">Talk to someone</p>
          <a class="primary sans" href="https://findahelpline.com" target="_blank" rel="noopener">Find support near you</a>
        </section>
        <div class="divider" aria-hidden="true"></div>
        <section class="choice">
          <p class="choice-label sans">In immediate danger</p>
          <a class="primary sans" href="https://en.wikipedia.org/wiki/List_of_emergency_telephone_numbers" target="_blank" rel="noopener">Emergency numbers</a>
        </section>
      </div>
    </div>
  </div>
</main>
</body>
</html>
