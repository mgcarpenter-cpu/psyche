<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming soon · Psyche</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  (function(){
    try{ var t=new URLSearchParams(location.search).get("t"); if(t){ document.getElementById("soonTitle").textContent=decodeURIComponent(t); } }catch(e){}
  })();
</script>
<link rel="stylesheet" href="site.css">
<style>
  :root{
    --cream:#faf8f3; --night:#06090f; --indigo:#1d3891;
    --panel:rgba(6,10,18,0.96); --line:rgba(250,248,243,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--font-sans);background:var(--night);color:var(--cream);display:flex;height:100dvh;overflow:hidden;}

  /* ===== SIDEBAR (identical to chat.html) ===== */
  nav{width:258px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;scrollbar-width:none;transition:margin-left 0.25s ease;z-index:5;}

































  /* ===== MAIN ===== */
  main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}





  .top-login{margin-left:auto;font-size:17px;color:var(--cream);text-decoration:none;text-shadow:0 1px 5px rgba(0,0,0,.8);}
  .top-login:hover{border-bottom:1px dotted rgba(250,248,243,.5);}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8;}
  .scrim.on{opacity:1;pointer-events:auto;}

  .content{flex:1;overflow-y:auto;}
  .page{max-width:720px;margin:0 auto;padding:34px 24px 90px;line-height:1.66;}
  .page h1{font-family:var(--font-sans);font-weight:600;font-size:34px;letter-spacing:.01em;margin-bottom:6px;}
  .updated{font-style:italic;font-size:15px;opacity:.5;margin-bottom:26px;}
  .page h2{font-weight:600;font-size:22px;margin:32px 0 10px;}
  .page p,.page li{font-size:17.5px;opacity:.9;margin-bottom:12px;}
  .page ul{padding-left:22px;margin-bottom:14px;}
  .page a{color:var(--cream);}
  .page a.bigbtn{color:#06090f;}
  .page strong{font-weight:600;}
  .note{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-style:italic;font-size:16px;opacity:.6;}


  .page{text-align:center;max-width:520px;padding-top:16vh;}
  .page h1{font-family:var(--font-sans);font-weight:600;font-size:34px;margin-bottom:14px;}
  .soonlede{font-size:18px;opacity:.7;line-height:1.6;font-style:italic;margin-bottom:30px;}
  .backlink{font-size:17px;color:var(--cream);text-decoration:underline;text-underline-offset:3px;opacity:.8;}
  .backlink:hover{opacity:1;}
</style>
</head>
<body class="site-shell">

<script src="site-header.js"></script>
<div class="scrim" id="scrim"></div>

<main>
  <div class="content">
    <div class="page">
      <h1 id="soonTitle">Coming soon</h1>
      <p class="soonlede">This part of Psyche is still being shaped. It'll be here before long.</p>
      <a class="backlink" href="chat.html">Back to your conversation</a>
        </div>
  </div>
</main>

<script>
  var nav=document.getElementById('nav'), scrim=document.getElementById('scrim');
  function openNav(){ nav.classList.remove('hidden'); nav.classList.add('open'); if(window.innerWidth<=760) scrim.classList.add('on'); }
  function closeNav(){ nav.classList.add('hidden'); nav.classList.remove('open'); scrim.classList.remove('on'); }
  function toggleNav(){ if(nav.classList.contains('hidden')) openNav(); else closeNav(); }
  document.getElementById('menuBtn').addEventListener('click', toggleNav);
  document.getElementById('collapseBtn').addEventListener('click', closeNav);
  scrim.addEventListener('click', closeNav);
  document.querySelectorAll('[data-route]').forEach(el=>{ el.onclick=()=>{ location.href=el.getAttribute('data-route'); }; });
  document.getElementById('newChat').onclick=()=>{ location.href='chat.html'; };
  // account chip: signed-out -> auth. (Code wires real session state.)
  var acctMenu=document.getElementById('acctMenu');
  document.getElementById('account').onclick=(e)=>{ e.stopPropagation(); location.href='auth.html'; };
  document.getElementById('acctSettings').onclick=()=>{ location.href='settings.html'; };
  document.getElementById('acctSignout').onclick=()=>{ location.href='index.html'; };
  document.addEventListener('click',e=>{ if(acctMenu&&!acctMenu.contains(e.target)&&!document.getElementById('account').contains(e.target)) acctMenu.classList.remove('open'); });

  // ---- session state: hide "log in" + fill account chip when signed in ----
  (function(){
    if(window.PSYCHE_PREVIEW) return;
    try{
      var sb=window.__sb||(window.__sb=supabase.createClient("https://hydzekyzbqhcvajnuegh.supabase.co","sb_publishable_4OMJbKxYkzEapBMABHuThw_E60ZNWEb"));
      sb.auth.getSession().then(async ({data})=>{
        var session=data && data.session;
        if(!session || !session.user){ return; }            // logged out: leave "log in" showing
        var login=document.getElementById('topLogin'); if(login) login.style.display='none';
        var acct=document.getElementById('account');
        try{
          var uid=session.user.id;
          var r=await sb.from('profiles').select('display_name,plan').eq('id',uid).single();
          var name=(r.data&&r.data.display_name)||session.user.email||'You';
          var plan=(r.data&&r.data.plan)?r.data.plan:'free';
          if(acct){
            acct.querySelector('.avatar-dot').textContent=name.trim().charAt(0).toUpperCase();
            acct.querySelector('.meta').innerHTML=name+'<br><span class="plan">'+(plan.charAt(0).toUpperCase()+plan.slice(1))+' plan</span>';
            acct.onclick=function(e){ e.stopPropagation(); var m=document.getElementById('acctMenu'); if(m) m.classList.toggle('open'); };
          }
        }catch(e){}
      });
    }catch(e){}
  })();

  // ---- recents: read the same conversation list chat.html stores ----
  (function(){
    var box=document.getElementById('recents');
    if(!box) return;
    var chats=[];
    try{ chats=JSON.parse(localStorage.getItem('psyche:chats'))||[]; }catch(e){ chats=[]; }
    var label=document.querySelector('.navlabel');
    if(!chats.length){ if(label) label.style.display='none'; return; }
    if(label) label.style.display='';
    chats.slice().reverse().forEach(function(c){
      var d=document.createElement('div');
      d.className='recent';
      d.textContent=(c.title)||'New conversation';
      d.title=(c.title)||'';
      d.onclick=function(){ try{ localStorage.setItem('psyche:current', c.id||''); }catch(e){} location.href='chat.html'; };
      box.appendChild(d);
    });
  })();


  (function(){
    try{ var t=new URLSearchParams(location.search).get("t"); if(t){ document.getElementById("soonTitle").textContent=decodeURIComponent(t); } }catch(e){}
  })();
</script>
</body>
</html>
