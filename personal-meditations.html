<!DOCTYPE html>
<html lang="en">
<head>
<script src="preview.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal meditations · Sussuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="site.css?v=20261124a">
<link rel="stylesheet" href="goals.css?v=20261124a">
<link rel="stylesheet" href="meditation-cover.css?v=20261116a">
<style>
  /* Personal meditations (layout only, 23 Nov 2026; values from personal-meditations-design.html).
     The frame of Goals: Talk it through. What Sussuri knows at the top, the member's meditations on the left,
     a chat with Sussuri on the right. Making is not connected yet: the chat is the sample from the design. */
  *{margin:0;padding:0;}
  html,body{height:100%;}
  body{background:#000;color:#fff;}
  .goals main{overflow-y:auto;gap:16px;padding-bottom:0;}
  .introrow{display:flex;justify-content:space-between;align-items:baseline;gap:24px;}
  .intro{margin:0;font-size:20px;color:#d6d6d2;}
  .left{font-size:18px;color:#d6d6d2;white-space:nowrap;}
  .left b{color:#fff;font-weight:400;}

  /* What Sussuri knows about you */
  .kn{border:1px solid #4a4a4a;border-radius:8px;padding:16px 20px 18px;}
  .knh{margin:0 0 12px;font-size:18px;color:#d6d6d2;}
  .knh b{color:#fff;font-weight:500;}
  .knr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .nd{border:1px solid #4a4a4a;border-radius:8px;padding:11px 14px;font-size:15.5px;line-height:1.2;color:var(--dim);display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;}
  .nd i{width:20px;height:20px;border-radius:50%;border:1px solid #6a6a6a;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:500;}
  .nd b{display:block;font-weight:500;font-size:17.5px;color:#fff;}
  .goals main .nd a{color:#fff;text-decoration:underline;text-underline-offset:4px;}
  .nd.ok{border-color:#fff;color:#fff;}
  .nd.ok i{background:#fff;border-color:#fff;color:#000;}

  /* the two columns */
  .work{display:flex;gap:24px;height:950px;flex:none;}
  .apanel{flex:0 0 290px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .apanel::-webkit-scrollbar{display:none;}
  .goals main .ara{flex:0 0 74px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;border:1px solid #4a4a4a;border-radius:8px;padding:0 16px;font-size:17.5px;line-height:1.25;width:100%;color:#fff;}
  .goals main .ara.on{background:#fff;color:#000;border-color:#fff;font-weight:400;}
  .goals main button.ara:not(.on):hover{background:rgba(255,255,255,.07);}
  .ara small{display:block;font-size:14px;color:var(--dim);}
  .plus{font-family:var(--display);font-size:34px;line-height:1;text-align:center;}
  .pl{width:32px;height:32px;border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;}
  .pl::before{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;}
  .ara.playing .pl{background:#fff;}
  .ara.playing .pl::before{border:0;width:8px;height:11px;margin:0;border-left:3px solid #000;border-right:3px solid #000;box-sizing:border-box;}
  .ph{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:10px 2px 0;}
  .none{margin:2px 2px 0;font-size:17px;color:var(--dim);}

  .talk{flex:1;min-width:0;min-height:0;border:1px solid #5a5a5a;border-radius:8px;display:flex;flex-direction:column;}
  .cmsgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;padding:20px 34px 18px;}
  .cmsgs::-webkit-scrollbar{display:none;}
  .cmsgs .s-sus,.cmsgs .s-you{flex:none;}
  .m{font-size:19px;line-height:1.4;max-width:80%;}
  .m small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:3px;}
  .m.y{align-self:flex-end;max-width:70%;border:1px solid #4a4a4a;border-radius:8px;padding:9px 14px;}
  .final{border:1px solid #fff;border-radius:8px;padding:16px 18px;max-width:86%;flex:none;}
  .final small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;}
  .final .ti{font-family:var(--display);font-size:32px;letter-spacing:.04em;line-height:1.15;}
  .final p{margin:6px 0 0;font-size:18px;color:#d6d6d2;}
  .final .wo{margin-top:12px;}
  .final p.pw{margin-top:0;}
  .gb{display:flex;gap:8px;margin-top:14px;align-items:center;}
  .goals main .final .put{padding:11px 18px;font-size:12px;}
  .goals main .final .chg{padding:11px 18px;font-size:12px;}
  .goals main .final .chg:hover{border-color:#fff;}
  .final p.made{margin-top:14px;color:#fff;}
  .inrow{padding:0 34px 22px;}
  .goals main .own input{border-radius:8px;}
  .goals main .own button{border-radius:8px;}

  .footl{margin:0 0 40px;font-size:15px;color:var(--dim);}

  /* the player bar, as on Meditations */
  .round{flex:0 0 auto;width:44px;height:44px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;}
  .round svg{width:14px;height:14px;fill:currentColor;}
  .player .tag,.player .time{font-family:var(--font-mono);font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-label);}
  .player{position:sticky;bottom:0;margin:-16px -72px 0;padding:14px 72px 16px;background:#000;border-top:1px solid var(--s-rule);display:flex;align-items:center;gap:20px;flex:0 0 auto;z-index:2;}
  .player[hidden]{display:none;}
  .player .cv{flex:0 0 auto;width:120px;border-radius:8px;border:1px solid var(--s-rule);overflow:hidden;}
  .goals main .player .pp{width:52px;height:52px;cursor:pointer;border:1px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .player .pp svg{width:16px;height:16px;}
  .player .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .player .now{display:flex;align-items:baseline;gap:14px;min-width:0;}
  .player .ttl{font-weight:400;font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player .tag{white-space:nowrap;}
  .player .scrub{position:relative;height:24px;cursor:pointer;display:flex;align-items:center;}
  .player .scrub::before{content:"";position:absolute;left:0;right:0;height:2px;background:#4a4a4a;}
  .player .scrub i{position:relative;display:block;height:2px;width:0;background:#fff;}
  .player .credit{font-size:13px;color:var(--s-label);}
  .player .credit b{font-weight:400;color:var(--s-text2);}
  .player .time{flex:0 0 auto;white-space:nowrap;}

  @media (max-width:1180px){ .work{flex-direction:column;height:auto;} .apanel{flex:none;overflow:visible;} .talk{height:min(680px,82dvh);flex:none;} }
  @media (max-width:1023px){ .player{margin:-16px -20px 0;padding:12px 20px 14px;gap:14px;} .player .cv,.player .credit,.player .tag{display:none;} .player .ttl{font-size:16px;} }
  @media (max-width:760px){
    .introrow{flex-direction:column;gap:6px;}
    .intro{font-size:18px;}
    .left{font-size:17px;white-space:normal;}
    .kn{padding:14px 14px 16px;}
    .knh{font-size:17px;}
    .knr{grid-template-columns:1fr;}
    .cmsgs{padding:16px;} .inrow{padding:0 16px 16px;}
    .m{max-width:92%;font-size:17.5px;} .m.y{max-width:85%;}
    .final{max-width:100%;padding:14px;}
    .final .ti{font-size:28px;}
    .final p{font-size:17px;}
    .gb{flex-direction:column;align-items:stretch;}
    .goals main .final .put,.goals main .final .chg{text-align:center;}
    .goals main .ara{font-size:17px;padding:0 12px;}
  }
</style>
</head>
<body class="site-shell goals">
<script src="site-header.js?v=20261124a" data-toggle></script>
<main>
  <div class="introrow"><p class="intro" id="lead"></p><span class="left" id="count"></span></div>
  <div class="kn">
    <p class="knh"><b>What Sussuri knows about you.</b> The more it knows, the more personal your meditation.</p>
    <div class="knr" id="knows"></div>
  </div>
  <div class="work">
    <aside class="apanel" id="list"></aside>
    <section class="talk">
      <div class="cmsgs" id="msgs" aria-live="polite"></div>
      <div class="inrow"><div id="pbox"></div></div>
    </section>
  </div>
  <p class="footl" id="foot"></p>
  <div class="player" id="player" hidden>
    <span class="cv" id="plCover" aria-hidden="true"></span>
    <button type="button" class="pp" id="plBtn" aria-label="Play"><svg id="plIcon" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor"><path d="M4 2l14 8-14 8z"/></svg></button>
    <div class="mid">
      <div class="now"><span class="ttl" id="plTitle"></span><span class="tag" id="plTag"></span></div>
      <div class="scrub" id="plScrub" role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><i id="plBar"></i></div>
      <div class="credit">Made for you by Sussuri, in <b>Mark Carpenter</b>'s voice</div>
    </div>
    <span class="time"><span id="plCur">0:00</span> / <span id="plDur">0:00</span></span>
    <audio id="plAudio" preload="none"></audio>
  </div>
</main>
<script src="site-chatbox.js?v=20261124a"></script>
<script src="meditation-sessions.js?v=20261124a"></script>
<script>
(function () {
  // ===== ALL THE WORDS AND SAMPLE CONTENT, IN ONE PLACE (from personal-meditations-design.html) =====
  // Swap SAMPLE.chat, SAMPLE.card and SAMPLE.made for the real thing when the questioning and making are connected.
  var TEXT = {
    lead: 'A meditation made just for you. Tell Sussuri what is going on, it designs the meditation, then makes it. About 20 minutes long.',
    countMember: ['4 of 4', ' left this month'],            // until making is connected: the full count
    countFree: ['1 of 1', ' left in your free month'],
    foot: 'Made for you by Sussuri, in Mark Carpenter’s voice. Only you can see and play these.',
    none: 'Nothing made yet.',
    making: 'Being made. This is a preview: making is not connected yet.'
  };
  var SAMPLE = {
    chat: [
      { r: 's', t: 'On Tuesday you told me your mind keeps going over work when you try to sleep. Is that what this one is for?' },
      { r: 'y', t: 'Yes. It’s most nights now.' },
      { r: 's', t: 'When it is going round, what is the thing you can’t put down?' },
      { r: 'y', t: 'That I’ve missed something, and it will be my fault.' },
      { r: 's', t: 'That is a lot to carry to bed. What would you rather feel as you lie there? And is there a place where you feel completely at ease?' },
      { r: 'y', t: 'That it’s handled and I can let go. The bush track behind my nan’s house.' }
    ],
    card: {
      name: 'Setting the day down',
      about: 'A slow walk along the bush track behind your nan’s house as the light fades. With each step you set down a little more of what you have been carrying, trusting the day is handled, and ease into sleep. About 20 minutes.',
      works: 'Underneath the going-over is a feeling that if you stop watching, something will go wrong and it will be on you. So the mind stays on guard, even in bed. This meditation gives it a safe place to practise putting that watch down, a little at a time, until letting go at night feels safe.'
    },
    // the made list, newest first. Shown in preview only (?preview=1; add &made=0 for the empty list).
    // These two have no audio of their own: they play a library meditation as a stand-in.
    made: [
      { title: 'Calm before the presentation', date: '18 Nov', mins: 21, audio: 'https://www.sussuri.com/media/calm-anxiety-now-20.mp3' },
      { title: 'Letting go of the argument', date: '11 Nov', mins: 19, audio: 'https://www.sussuri.com/media/let-go-of-the-day-30.mp3' }
    ]
  };

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function read(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function dmy(d) { return d.getDate() + ' ' + MON[d.getMonth()]; }
  function acct() { return (window.sussuriAccount && window.sussuriAccount.get()) || { state: 'visitor' }; }

  $('lead').textContent = TEXT.lead;
  $('foot').textContent = TEXT.foot;

  // ===== the count =====
  function drawCount() {
    var c = acct().state === 'member' ? TEXT.countMember : TEXT.countFree, n = $('count');
    n.innerHTML = ''; n.appendChild(el('b', '', c[0])); n.appendChild(document.createTextNode(c[1]));
  }

  // ===== What Sussuri knows about you: real data =====
  function knowYourself() {          // localStorage psyche:assessment, saved by assessment.html with the date (at)
    var r = read('psyche:assessment');
    if (!r || !r.archName) return null;
    var d = new Date(r.at); return isNaN(d) ? 'Done' : 'Done ' + dmy(d);
  }
  function lastChat() {              // localStorage psyche:chats (chat.html). A chat's id is the time it was started.
    var list = read('psyche:chats'), t = 0;
    (Array.isArray(list) ? list : []).forEach(function (c) {
      var said = (c.messages || []).some(function (m) { return m.role === 'user'; }), at = Number(c.id) || 0;
      if (said && at > t) t = at;
    });
    if (!t) return null;
    var d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
    var day = new Date(d); day.setHours(0, 0, 0, 0);
    var ago = Math.round((today - day) / 864e5);
    if (ago <= 0) return 'Last one today';
    if (ago === 1) return 'Last one yesterday';
    if (ago < 7) return 'Last one on ' + DAY[d.getDay()];
    return 'Last one on ' + dmy(d);
  }
  function goalsSet() {              // localStorage sussuri:goals:<user id> (goals.js). Set = at least one area done.
    var id = window.PSYCHE_PREVIEW ? 'preview' : acct().id;
    var g = id && read('sussuri:goals:' + id);
    if (!g || !Array.isArray(g.areas)) return null;
    var done = g.areas.some(function (a) { return !a.left && (a.lines || []).filter(Boolean).length === 4; });
    if (!done) return null;
    var d = new Date(g.updated); return isNaN(d) || !g.updated ? 'Set' : 'Set ' + dmy(d);
  }
  function drawKnows() {
    var box = $('knows'); box.innerHTML = '';
    [
      ['Know yourself', knowYourself(), 'Not done yet. ', 'Do Know yourself', 'assessment.html'],
      ['Your chats', lastChat(), 'No chats yet. ', 'Start a chat', 'chat.html'],
      ['Your goals', goalsSet(), 'Not set yet. ', 'Set your goals', 'your-goals.html']
    ].forEach(function (k) {
      var d = el('div', 'nd' + (k[1] ? ' ok' : '')), s = el('span');
      d.appendChild(el('i', '', k[1] ? '✓' : ''));
      s.appendChild(el('b', '', k[0]));
      if (k[1]) s.appendChild(document.createTextNode(k[1]));
      else { s.appendChild(document.createTextNode(k[2])); var a = el('a', '', k[3]); a.href = k[4]; s.appendChild(a); }
      d.appendChild(s); box.appendChild(d);
    });
  }

  // ===== left column: New meditation, then the member's meditations =====
  // Nothing can be made yet, so a member's own list is empty. Preview shows the design's two samples.
  var made = window.PSYCHE_PREVIEW && new URLSearchParams(location.search).get('made') !== '0' ? SAMPLE.made : [];
  var now = -1, au = $('plAudio');
  var PLAY = '<path d="M4 2l14 8-14 8z"/>', PAUSE = '<path d="M4 2h4v16H4zM12 2h4v16h-4z"/>';
  function drawList() {
    var box = $('list'); box.innerHTML = '';
    var nw = el('button', 'ara on'); nw.type = 'button'; nw.setAttribute('aria-pressed', 'true');
    nw.appendChild(el('span', 'plus', '+')); nw.appendChild(el('span', '', 'New meditation'));
    nw.addEventListener('click', function () { tbox.focus(); });
    box.appendChild(nw);
    box.appendChild(el('p', 'ph', 'Your meditations'));
    if (!made.length) { box.appendChild(el('p', 'none', TEXT.none)); return; }
    made.forEach(function (it, i) {
      var b = el('button', 'ara' + (i === now && !au.paused ? ' playing' : '')), t = el('span', '', it.title);
      b.type = 'button'; b.setAttribute('aria-label', (i === now && !au.paused ? 'Pause ' : 'Play ') + it.title);
      b.appendChild(el('span', 'pl')); t.appendChild(el('small', '', it.date + ' · ' + it.mins + ' min')); b.appendChild(t);
      b.addEventListener('click', function () { pick(i); });
      box.appendChild(b);
    });
  }

  // ===== the player bar (as on Meditations) =====
  function fmt(t) { t = Math.max(0, t | 0); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
  function mark() { $('plIcon').innerHTML = au.paused ? PLAY : PAUSE; $('plBtn').setAttribute('aria-label', au.paused ? 'Play' : 'Pause'); drawList(); }
  function pick(i) {
    if (i === now) { if (au.paused) au.play().catch(function () {}); else au.pause(); return; }
    now = i; var it = made[i];
    $('plCover').innerHTML = window.sussuriCover ? window.sussuriCover({ title: it.title }) : '';
    $('plTitle').textContent = it.title;
    $('plTag').textContent = 'Personal meditation · ' + it.mins + ' mins';
    $('plBar').style.width = '0'; $('plCur').textContent = '0:00'; $('plDur').textContent = '0:00';
    $('player').hidden = false;
    au.src = it.audio; au.play().catch(function () {});
    mark();
  }
  $('plBtn').onclick = function () { if (now < 0) return; if (au.paused) au.play().catch(function () {}); else au.pause(); };
  au.onplay = au.onpause = mark;
  au.onended = function () { $('plBar').style.width = '0'; mark(); };
  au.onloadedmetadata = function () { $('plDur').textContent = fmt(au.duration); };
  au.ontimeupdate = function () { $('plCur').textContent = fmt(au.currentTime); if (au.duration) { var p = au.currentTime / au.duration * 100; $('plBar').style.width = p + '%'; $('plScrub').setAttribute('aria-valuenow', Math.round(p)); } };
  $('plScrub').onclick = function (e) { var r = this.getBoundingClientRect(); if (au.duration) au.currentTime = (e.clientX - r.left) / r.width * au.duration; };
  $('plScrub').onkeydown = function (e) { if (!au.duration) return; if (e.key === 'ArrowRight') au.currentTime = Math.min(au.duration, au.currentTime + 15); if (e.key === 'ArrowLeft') au.currentTime = Math.max(0, au.currentTime - 15); };

  // ===== the chat: the sample conversation, then Sussuri's card =====
  function drawChat() {
    var box = $('msgs'); box.innerHTML = '';
    SAMPLE.chat.forEach(function (c) {
      box.appendChild(el('div', c.r === 'y' ? 's-you' : 's-sus', c.t));   // the Chat page's message style
    });
    var k = SAMPLE.card, f = el('div', 'final'), gb = el('div', 'gb');
    f.appendChild(el('small', '', 'Here is what I’ll make for you'));
    f.appendChild(el('div', 'ti', k.name));
    f.appendChild(el('p', '', k.about));
    f.appendChild(el('small', 'wo', 'What it works on'));
    f.appendChild(el('p', 'pw', k.works));
    var mk = el('button', 'put', 'Make it'), ch = el('button', 'chg', 'Change something');
    mk.type = ch.type = 'button';
    // MAKE IT: preview only. Nothing is made, nothing is added to the list, the count stays.
    mk.addEventListener('click', function () { f.replaceChild(el('p', 'made', TEXT.making), gb); });
    ch.addEventListener('click', function () { tbox.focus(); });
    gb.appendChild(mk); gb.appendChild(ch); f.appendChild(gb);
    box.appendChild(f);
  }
  // The Chat page's typing box (site-chatbox.js). It takes text, but sending is not connected yet (the questioning comes later).
  var tbox = sussuriBox.mount($('pbox'), { placeholder:'Type your answer', label:'Type your answer', onSend: function (t) { tbox.set(t); } });

  drawCount(); drawKnows(); drawList(); drawChat();
  if (window.sussuriAccount) window.sussuriAccount.onChange(function () { drawCount(); drawKnows(); });
})();
</script>
</body>
</html>
